name: TaskForgeLink
version: 1.10.0
main: com.taskforge.folia.TaskForgeLinkPlugin
api-version: '26.1.2'
folia-supported: true
softdepend: [Worlds, Terra, Portals]
commands:
  tfback:
    description: Legacy TaskForge death command
    usage: /tfback
  tfdeath:
    description: Handles TaskForge death-offer buttons
    usage: /tfdeath <deathId> <coordinates|chest|return|both|inventory|drop|ack>
    permission: taskforge.death.use
  taskforgelink:
    description: Reload or inspect TaskForgeLink without restarting the server
    usage: /taskforgelink <reload|refresh|status>
    aliases: [tflink]
permissions:
  taskforge.link.reload:
    description: Reload TaskForgeLink configuration and runtime components
    default: op
  taskforge.death.use:
    description: Use TaskForge death recovery buttons
    default: true
