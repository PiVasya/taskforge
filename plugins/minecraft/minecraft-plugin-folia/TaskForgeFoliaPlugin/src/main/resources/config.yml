http:
  host: 0.0.0.0
  port: 25566
  path: /taskforge/link/send

security:
  taskforgeKey: "CHANGE_ME"
  allowedIps: []

taskforge:
  apiBaseUrl: ""
  pluginKey: ""
  timeoutSeconds: 5

deathRecovery:
  enabled: true
  offerSeconds: 300
  spectatorSeconds: 5
  maxDistance: 12
  chestSearchRadius: 16
  emergencyChestSearchRadius: 256
  safeSearchRadius: 8
  coordinatesCost: 10
  chestCost: 50
  teleportCost: 100
  backendTimeoutMillis: 5000
  # Optional overrides. Empty values reuse taskforge.apiBaseUrl and taskforge.pluginKey.
  apiBaseUrl: ""
  serverToken: ""

exemptions:
  nicks: []
  uuids: []

chat:
  enabled: true
  pollOnlyWhenPlayersOnline: true
  pollIntervalSeconds: 12
  forwardJoinQuit: true
  forwardPlayerMessages: true
  forwardAdvancements: true
  includeRecipeAdvancements: false
  includeRootAdvancements: false
  sitePrefix: "§d[TaskForge]§r "
  minecraftPrefix: "[MC] "
