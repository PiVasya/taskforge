http:
  host: 0.0.0.0
  port: 25566
  path: /taskforge/link/send

security:
  taskforgeKey: "CHANGE_ME"
  allowedIps: []

taskforge:
  apiBaseUrl: ""
  pluginKey: ""
  timeoutSeconds: 4

deathTeleport:
  enabled: true
  cost: 100
  offerTtlSeconds: 300
  messageDelayTicks: 20
  recovery:
    spectatorSeconds: 10
    maxDistance: 24
    safeSearchRadius: 8
    fireResistanceSeconds: 60
    resistanceSeconds: 10
    regenerationSeconds: 10
    slowFallingSeconds: 10

exemptions:
  nicks: []
  uuids: []

chat:
  enabled: true
  pollOnlyWhenPlayersOnline: true
  pollIntervalSeconds: 12
  forwardJoinQuit: true
  forwardPlayerMessages: true
  forwardAdvancements: true
  includeRecipeAdvancements: false
  includeRootAdvancements: false
  sitePrefix: "§d[TaskForge]§r "
  minecraftPrefix: "[MC] "
