# After editing this file, run /tflink reload. A full Minecraft restart is not required.
http:
  host: 0.0.0.0
  port: 25566
  path: /taskforge/link/send

security:
  taskforgeKey: "CHANGE_ME"
  allowedIps: []

taskforge:
  apiBaseUrl: "https://taskforge.by"
  pluginKey: ""
  timeoutSeconds: 5

deathRecovery:
  enabled: true
  offerSeconds: 300
  spectatorSeconds: 5
  maxDistance: 12
  chestSearchRadius: 16
  emergencyChestSearchRadius: 256
  safeSearchRadius: 8
  coordinatesCost: 10
  chestCost: 50
  teleportCost: 100
  inventoryCost: 300
  # Chat delivery cannot be acknowledged by the Minecraft protocol itself, so the
  # plugin repeats the offer until the player clicks an action or confirms that
  # the message is visible. These defaults are intentionally calm enough not to spam.
  offerDisplayCooldownSeconds: 12
  offerReminderInitialDelaySeconds: 8
  offerReminderIntervalSeconds: 20
  # Coordinates/chest notices are retried while the player is online until the
  # server-side send finishes successfully. Offline players are retried on join.
  notificationRetryIntervalSeconds: 10
  backendTimeoutMillis: 5000
  # Link state is checked on join/reload and updated by authoritative backend responses.
  # There is no periodic status polling while a player is online.
  # Optional overrides. Empty values reuse taskforge.apiBaseUrl and taskforge.pluginKey.
  apiBaseUrl: ""
  serverToken: ""

exemptions:
  nicks: []
  uuids: []

chat:
  enabled: true
  pollOnlyWhenPlayersOnline: true
  pollIntervalSeconds: 12
  forwardJoinQuit: true
  forwardPlayerMessages: true
  forwardAdvancements: true
  includeRecipeAdvancements: false
  includeRootAdvancements: false
  sitePrefix: "§d[TaskForge]§r "
  minecraftPrefix: "[MC] "

# Normal diagnostics: detailed death-flow logs only.
# Verbose HTTP bodies, scheduler internals and journal writes are disabled by default.
debug:
  enabled: true
  deathRecovery: true
  verboseHttp: false
  verboseHttpBodies: false
  verboseScheduler: false
  verboseJournal: false

# Optional network probe for manual diagnostics. 0 means disabled.
diagnostics:
  connectivityProbeSeconds: 0
