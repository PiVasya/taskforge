plugins {
    id 'java'
}

group = 'me.vasya'
version = '2.8.3'

def targetJava = 25
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJava)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.74-stable'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJava)
}

jar {
    archiveBaseName = 'CustomMobTweaks'
}

// A separate source set keeps executable rule tests independent of JUnit discovery.
sourceSets {
    combatTest {
        java.srcDir 'src/combatTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('combatRulesTest', JavaExec) {
    dependsOn tasks.named('combatTestClasses')
    classpath = sourceSets.combatTest.runtimeClasspath
    mainClass = 'me.vasya.custommobtweaks.combat.CombatRulesTest'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(targetJava)
    }
}

tasks.named('check') {
    dependsOn tasks.named('combatRulesTest')
}
