# CustomMobTweaks 2.0.0
# Target: Folia 26.1.2 / Java 25.
# Chances accept either 0.0-1.0 or percentages greater than 1 (for example 2 = 2%).

# -----------------------------------------------------------------------------
# Existing CustomMobTweaks mechanics
# -----------------------------------------------------------------------------
blaze-fireball-lightning:
  enabled: true
  effect-only: true
  fire-ticks: 0

bogged-arrow-wither:
  enabled: true
  duration-ticks: 40
  amplifier: 0

wither-skeleton-stun:
  enabled: true
  duration-ticks: 30
  slowness-amplifier: 10
  apply-weakness: true
  apply-darkness: true

snow-golem-snowball:
  enabled: true
  damage: 0.5
  slowness-chance: 0.15
  slowness-duration-ticks: 20
  slowness-amplifier: 0

breeze-wind-charge:
  enabled: true
  bonus-damage: 1.0
  vertical-knockback: 0.35
  spawn-cloud-particles: true

breeze-fireball-primary:
  enabled: true
  projectile-speed-multiplier: 1.15
  bonus-damage: 1.0
  fire-ticks: 40
  incendiary: false

# Applied when a drowned-thrown trident hits something.
drowned-trident-glow:
  enabled: true
  duration-ticks: 80
  amplifier: 0

pillager-armor-pierce:
  enabled: true
  ignore-armor: true
  ignore-protection-enchants: true
  bonus-damage: 0.6

stray-chill:
  enabled: true
  duration-ticks: 60
  amplifier: 0

skeleton-sniper:
  enabled: true
  include-strays: true
  include-bogged: false
  follow-range: 56.0
  minimum-distance: 9.0
  preferred-distance: 24.0
  retreat-when-close: true
  retreat-strength: 0.28
  speed-multiplier: 1.22
  base-damage-bonus: 0.0
  far-shot-damage-bonus: 0.35
  prediction-factor: 0.7
  require-line-of-sight: true
  disable-arrow-gravity: true
  critical: false
  aim-at-body: true
  continuous-homing: true
  homing-ticks: 18
  homing-turn-rate: 0.35
  homing-lead-factor: 0.35
  max-track-distance: 40.0

# -----------------------------------------------------------------------------
# Mechanics ported and rebuilt from CreakingPerks
# -----------------------------------------------------------------------------
harder-creaking:
  enabled: true
  # Potion amplifier, 9 means Speed X.
  speed-amplifier: 9
  hit-damage: 20.0
  blindness-duration-ticks: 100
  darkness-radius: 10.0
  darkness-duration-ticks: 50
  darkness-check-period-ticks: 20

harder-breeze:
  enabled: true

  # A Breeze shoots an additional wind charge at the closest visible player.
  attack-cooldown-ticks: 10
  attack-range: 16.0
  projectile-speed: 1.5
  require-line-of-sight: true

  # Taking damage from the Breeze starts a rain of wind charges over the player.
  projectile-rain-amount: 5
  projectile-rain-radius: 3.0
  projectile-rain-height: 8.0
  projectile-rain-speed: 0.5
  projectile-rain-duration-ticks: 60
  projectile-rain-period-ticks: 10

  # Every Breeze wind charge creates a visual blast and pushes nearby entities.
  explosion-radius: 3.0
  explosion-knockback: 1.5
  explosion-damage: 0.0

  # CreakingPerks used a 5% radiation-zone chance for Breeze charges.
  radiation-zone:
    enabled: true
    chance: 0.05
    radius: 5.0
    knockback: 2.0
    fire-duration-ticks: 100
    duration-ticks: 120
    check-period-ticks: 5
    item-drop-interval-ticks: 60
    drop-random-inventory-items: true
    particle-density: 50

harder-bogged:
  enabled: true
  bleeding-duration-ticks: 100
  poison-duration-ticks: 20
  particle-spawn-interval-ticks: 5

  # Green blood puddles remain on the ground and empower the first hostile mob
  # that steps into them. Bogged themselves are not buffed.
  blood-particle-duration-ticks: 100
  puddle-check-period-ticks: 5
  puddle-trigger-radius: 1.0
  mob-buff-duration-ticks: 200
  mob-size-multiplier: 1.25
  mob-damage-multiplier: 1.5

harder-armadillo:
  enabled: true
  base-sphere-radius: 10.0
  radius-per-20-percent-health-loss: 5.0
  sphere-duration-ticks: 100
  check-period-ticks: 5
  particle-density: 20
  push-force: 1.5

harder-stray:
  enabled: true
  freeze-duration-ticks: 100
  freeze-damage-interval-ticks: 20
  slowness-amplifier: 1
  particle-density: 10

  # true: temporarily removes maximum health every interval, then restores it.
  # false: deals direct damage instead.
  use-max-health-reduction: true
  max-health-reduction-per-interval: 0.5
  direct-damage-per-interval: 16.0

illusioner-spawn:
  enabled: true
  # No custom/purple name is assigned.
  replace-natural-hostile-mobs: true
  replacement-chance: 0.001
  give-bow: true
  health-multiplier: 1.0

  # Additional Folia-safe spawn attempts around online players.
  periodic-check-interval-ticks: 600
  periodic-spawn:
    enabled: true
    chance-per-check: 0.001
    min-radius: 24
    max-radius: 48
    max-block-light: 7
    no-other-illusioner-radius: 48.0

# A new configurable elite zombie variant requested for this update.
trident-zombie:
  enabled: true
  spawn-chance: 0.03
  health-multiplier: 1.5
  damage-multiplier: 1.35
  speed-multiplier: 1.10
  attack-range: 18.0
  attack-cooldown-ticks: 50
  trident-speed: 1.35
  trident-damage: 8.0
  require-line-of-sight: true

freezing-snowball:
  enabled: true
  players-only: false
  freeze-duration-ticks: 60
  slowness-amplifier: 2
  mining-fatigue-amplifier: 1
  particle-density: 15

lava-damage:
  enabled: true
  check-period-ticks: 10
  armor-damage-interval-ticks: 20
  regular-armor-damage: 50
  netherite-health-damage: 4.0
  netherite-item-melt-interval-ticks: 40
  netherite-repair-amount: 10
  particle-density: 15
  notify-item-melt: true

dry-weapon:
  enabled: true
  weapon-durability: 150
  long-range-damage: 2.0
  short-range-damage: 1.0
  max-range: 10.0
  ray-size: 0.45
  min-ammo-cost: 1
  max-ammo-cost: 10
  craft-fail-chance: 0.05
  min-fire-rate: 1
  max-fire-rate: 3
  leaf-hit-tracking-duration-ticks: 1200
  tornado-minimum-hits: 5
  tornado-chance: 0.2
  tornado-lift-per-2-hits: 1
  tornado-max-lift-blocks: 50
  fire-effect-chance: 0.2
  fire-effect-duration-ticks: 60
  splinter-effect-chance: 0.2
  splinter-effect-duration-ticks: 100
  durability-damage-chance: 0.2
  item-durability-damage: 5

happy-ghast-bomber:
  enabled: true
  slow-drop-interval-ticks: 20
  fast-drop-interval-ticks: 20
  fast-mode-min-tnt: 10
  min-tnt-cost: 1
  max-tnt-cost: 5
  projectile-count: 5
  projectile-spread: 2.0
  projectile-speed: 0.8
  radiation-zone:
    radius: 5.0
    knockback: 2.0
    fire-duration-ticks: 100
    duration-ticks: 120
    check-period-ticks: 5
    item-drop-interval-ticks: 60
    drop-random-inventory-items: true
    particle-density: 50

# -----------------------------------------------------------------------------
