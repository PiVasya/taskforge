# CustomMobTweaks 2.7.0
# Target: Folia 26.1.2 / Java 25.
# 20 ticks = 1 second.
# Damage is measured in health points: 2.0 = one heart.
# Chances use fractions: 0.05 = 5%, 0.50 = 50%, 1.0 = 100%.

# -----------------------------------------------------------------------------
# Blaze: real lightning, longer burning, richer loot.
# -----------------------------------------------------------------------------
blaze-fireball-lightning:
  enabled: true
  effect-only: false
  fire-ticks: 100

# -----------------------------------------------------------------------------
# Bogged: Wither II arrows plus poison/bleeding puddles that empower mobs.
# -----------------------------------------------------------------------------
bogged-arrow-wither:
  enabled: true
  duration-ticks: 100
  amplifier: 1

harder-bogged:
  enabled: true
  bleeding-duration-ticks: 160
  poison-duration-ticks: 80
  particle-spawn-interval-ticks: 8
  blood-particle-duration-ticks: 160
  puddle-check-period-ticks: 4
  puddle-trigger-radius: 1.5
  mob-buff-duration-ticks: 300
  mob-size-multiplier: 1.5
  mob-damage-multiplier: 2.0

# -----------------------------------------------------------------------------
# Wither skeleton: hard three-second stun with weakness and darkness.
# -----------------------------------------------------------------------------
wither-skeleton-stun:
  enabled: true
  duration-ticks: 60
  slowness-amplifier: 10
  apply-weakness: true
  apply-darkness: true

# -----------------------------------------------------------------------------
# Snow golem: every hit slows, plus one point of bonus damage.
# -----------------------------------------------------------------------------
snow-golem-snowball:
  enabled: true
  damage: 1.0
  slowness-chance: 1.0
  slowness-duration-ticks: 40
  slowness-amplifier: 1

# -----------------------------------------------------------------------------
# Breeze: maximum pressure and control, but only moderate direct damage.
# -----------------------------------------------------------------------------
breeze-wind-charge:
  enabled: true
  bonus-damage: 1.0
  vertical-knockback: 0.8
  spawn-cloud-particles: true

breeze-fireball-primary:
  enabled: true
  projectile-speed-multiplier: 1.4
  bonus-damage: 1.0
  fire-ticks: 80
  incendiary: false

harder-breeze:
  enabled: true
  attack-cooldown-ticks: 12
  attack-range: 32.0
  projectile-speed: 1.0
  require-line-of-sight: true

  projectile-rain-amount: 10
  projectile-rain-radius: 5.0
  projectile-rain-height: 12.0
  projectile-rain-speed: 0.8
  projectile-rain-duration-ticks: 100
  projectile-rain-period-ticks: 8

  explosion-radius: 5.0
  explosion-knockback: 1.5
  explosion-damage: 1.0

drowned-trident-glow:
  enabled: true
  duration-ticks: 2400
  amplifier: 0

# -----------------------------------------------------------------------------
# Pillager: full armor/protection penetration, no bonus damage.
# -----------------------------------------------------------------------------
pillager-armor-pierce:
  enabled: true
  ignore-armor: true
  ignore-protection-enchants: true
  bonus-damage: 0.0

# -----------------------------------------------------------------------------
# Stray: 1.5 seconds of strong chill and one half-heart maximum-health loss.
# The maximum health is restored when the effect ends.
# -----------------------------------------------------------------------------
stray-chill:
  enabled: true
  duration-ticks: 30
  amplifier: 10

harder-stray:
  enabled: true
  freeze-duration-ticks: 30
  freeze-damage-interval-ticks: 30
  slowness-amplifier: 4
  particle-density: 20
  use-max-health-reduction: true
  max-health-reduction-per-interval: 1.0
  direct-damage-per-interval: 0.0

# -----------------------------------------------------------------------------
# Skeleton sniper: 30% vanilla arrow speed, no bonus damage, extreme homing.
# A shield can still block the arrow.
# -----------------------------------------------------------------------------
skeleton-sniper:
  enabled: true
  follow-range: 64.0
  minimum-distance: 0.0
  preferred-distance: 32.0
  retreat-when-close: true
  retreat-strength: 0.45
  speed-multiplier: 0.3
  base-damage-bonus: 0.0
  far-shot-damage-bonus: 0.0
  prediction-factor: 1.0
  require-line-of-sight: true
  disable-arrow-gravity: true
  critical: false
  aim-at-body: true
  continuous-homing: true
  homing-ticks: 200
  homing-turn-rate: 0.90
  homing-lead-factor: 0.95
  max-track-distance: 96.0

# -----------------------------------------------------------------------------
# Creaking: much faster, lethal melee hit, large darkness aura.
# -----------------------------------------------------------------------------
harder-creaking:
  enabled: true
  speed-amplifier: 14
  hit-damage: 28.0
  blindness-duration-ticks: 160
  darkness-radius: 20.0
  darkness-duration-ticks: 80
  darkness-check-period-ticks: 10

# -----------------------------------------------------------------------------
# Armadillo: very large and powerful defensive sphere.
# -----------------------------------------------------------------------------
harder-armadillo:
  enabled: true
  base-sphere-radius: 16.0
  radius-per-20-percent-health-loss: 8.0
  sphere-duration-ticks: 240
  check-period-ticks: 2
  particle-density: 50
  push-force: 4.0

# -----------------------------------------------------------------------------
# Illusioner: 1% replacement chance and 1% periodic chance per check/player.
# -----------------------------------------------------------------------------
illusioner-spawn:
  enabled: true
  replace-natural-hostile-mobs: true
  replacement-chance: 0.01
  give-bow: true
  health-multiplier: 2.0
  periodic-check-interval-ticks: 600
  periodic-spawn:
    enabled: true
    chance-per-check: 0.01
    min-radius: 24
    max-radius: 56
    max-block-light: 7
    no-other-illusioner-radius: 64.0

# -----------------------------------------------------------------------------
# Illusioner recursive clones: 30 active copies, shorter life each generation.
# -----------------------------------------------------------------------------
illusioner-clones:
  enabled: true
  verbose-logs: true
  clones-per-shot: 1
  max-active-per-original: 30
  max-generation: 7

  max-health: 1.0
  damage-multiplier: 0.35

  base-lifetime-ticks: 300
  lifetime-reduction-per-generation-ticks: 40
  minimum-lifetime-ticks: 60

  spawn-min-radius: 1.5
  spawn-max-radius: 3.5
  spawn-location-attempts: 10
  spawn-particles: 30
  dissolve-particles: 24

  original-death-delay-ticks: 40

# -----------------------------------------------------------------------------
# Trident zombie: three times the normal health and stronger ranged pressure.
# -----------------------------------------------------------------------------
trident-zombie:
  enabled: true
  spawn-chance: 0.03
  health-multiplier: 3.0
  damage-multiplier: 1.5
  speed-multiplier: 1.15
  attack-range: 24.0
  attack-cooldown-ticks: 35
  trident-speed: 1.6
  trident-damage: 8.0
  require-line-of-sight: true

# -----------------------------------------------------------------------------
# Every snowball fully stops its target for half a second.
# -----------------------------------------------------------------------------
freezing-snowball:
  enabled: true
  players-only: false
  freeze-duration-ticks: 10
  slowness-amplifier: 10
  mining-fatigue-amplifier: 3
  particle-density: 20

# -----------------------------------------------------------------------------
# Lava and armor: unchanged.
# -----------------------------------------------------------------------------
lava-damage:
  enabled: true
  check-period-ticks: 10
  armor-damage-interval-ticks: 20
  regular-armor-damage: 50
  netherite-health-damage: 4.0
  netherite-item-melt-interval-ticks: 40
  netherite-repair-amount: 10
  particle-density: 15
  notify-item-melt: true

# -----------------------------------------------------------------------------
# Dry weapon: always consumes exactly one ammo item.
# Other values are tuned for a powerful but not instant-kill utility weapon.
# -----------------------------------------------------------------------------
dry-weapon:
  enabled: true
  weapon-durability: 250
  long-range-damage: 3.0
  short-range-damage: 1.5
  max-range: 14.0
  ray-size: 0.35
  min-ammo-cost: 1
  max-ammo-cost: 1
  craft-fail-chance: 0.05
  min-fire-rate: 2
  max-fire-rate: 4
  leaf-hit-tracking-duration-ticks: 800
  tornado-minimum-hits: 4
  tornado-chance: 0.25
  tornado-lift-per-2-hits: 2
  tornado-max-lift-blocks: 35
  fire-effect-chance: 0.20
  fire-effect-duration-ticks: 80
  splinter-effect-chance: 0.25
  splinter-effect-duration-ticks: 120
  durability-damage-chance: 0.20
  item-durability-damage: 6

# -----------------------------------------------------------------------------
# Happy ghast bomber: disabled completely.
# -----------------------------------------------------------------------------
happy-ghast-bomber:
  enabled: false
  slow-drop-interval-ticks: 20
  fast-drop-interval-ticks: 20
  fast-mode-min-tnt: 10
  min-tnt-cost: 1
  max-tnt-cost: 5
  projectile-count: 5
  projectile-spread: 2.0
  projectile-speed: 0.8

# -----------------------------------------------------------------------------
# Phantom aggro repair: phantoms created manually from spawn eggs or commands
# are explicitly given the nearest Survival/Adventure player as a target.
# Natural phantoms, dragon phantoms and temporary dive copies are untouched.
# -----------------------------------------------------------------------------
phantom-aggro:
  enabled: true
  debug: true
  manage-spawner-egg: true
  manage-command: true
  manage-custom: false
  target-range: 96.0
  controller-period-ticks: 10
  target-refresh-period-ticks: 20

# -----------------------------------------------------------------------------
# Phantom: every ordinary or dragon-spawned phantom creates one small 1 HP copy
# when its vanilla sweep attack begins. Generated copies never copy themselves,
# preventing recursive growth.
# -----------------------------------------------------------------------------
phantom-dive-clones:
  enabled: true
  debug: true
  monitor-period-ticks: 1
  cooldown-ticks: 40
  health: 1.0
  size: 0
  attack-damage: 2.0
  lifetime-ticks: 200
  maximum-active-total: 96
  maximum-active-per-parent: 2
  purple-aura:
    period-ticks: 5
    purple-dust-particles: 5
    dragon-breath-particles: 3
    portal-particles: 2

# -----------------------------------------------------------------------------
# Ender Dragon: sustained wide fire stream plus a purple Phantom flock
# for each completed portal landing. Detailed event logs are enabled for testing.
# -----------------------------------------------------------------------------
ender-dragon-rework:
  enabled: true
  debug: true

  # The primary vanilla Ender Dragon keeps its normal AI, but its maximum
  # health is multiplied once from the vanilla base. Reload preserves the
  # current health percentage instead of multiplying the value repeatedly.
  primary-dragon:
    health-multiplier: 2.0

  # Triggered once when a genuinely seated dragon leaves the exit portal.
  # The expanding two-layer ring damages, pushes, darkens and temporarily
  # prevents Elytra activation for players caught by the wave.
  void-roar:
    enabled: true
    maximum-radius: 20.0
    expansion-period-ticks: 2
    ring-step: 3.0
    ring-thickness: 1.75
    vertical-range: 12.0
    lower-ring-height: 1.2
    upper-ring-height: 3.2
    points-per-ring: 72

    damage: 4.0
    horizontal-knockback: 2.2
    vertical-knockback: 0.65
    darkness-duration-ticks: 80
    disable-elytra-duration-ticks: 50

    dragon-breath-particles-per-point: 1
    portal-particles-per-point: 1
    smoke-particles-per-point: 1

  # After the same completed portal sitting cycle, crystals are scattered over
  # valid End-stone/obsidian surfaces around the main island. They are normal
  # destructible End Crystals and can heal the primary dragon.
  crystal-field:
    enabled: true
    count-min: 18
    count-max: 24
    maximum-active: 48
    minimum-radius: 18.0
    maximum-radius: 96.0
    placement-attempts-per-crystal: 8
    show-bottom: true

  fire-stream:
    enabled: true

    # Replace both vanilla ranged attack paths. STRAFING normally shoots one
    # DragonFireball, while BREATH_ATTACK normally creates a stationary cloud
    # when the dragon is perched on the exit portal.
    replace-strafing-fireball: true
    replace-perched-breath: true

    # Seven seconds of continuous flame. The stream grows during the first
    # ramp-up ticks, then keeps burning the full cone until the attack ends.
    duration-ticks: 140
    period-ticks: 2
    ramp-up-ticks: 18
    length: 42.0

    # A wide three-dimensional cone, not a thin laser.
    slices-per-pulse: 10
    rays-per-slice: 3
    spread-angle-degrees: 10.0
    minimum-radius: 0.75
    maximum-radius: 5.5
    vertical-radius-multiplier: 0.80

    # Repeated contact damage while the player remains inside the stream.
    damage: 3.0
    damage-interval-ticks: 10
    fire-ticks: 100

    # Particle density per sampled point of the cone.
    orange-flame-particles-per-point: 2
    purple-flame-particles-per-point: 1
    dragon-breath-particles-per-point: 2
    smoke-particles-per-point: 1

    ground:
      enabled: true
      sample-interval-ticks: 4
      patches-per-sample: 4
      minimum-distance: 6.0
      search-depth: 192.0
      lateral-spread-multiplier: 1.25

      # Real FIRE blocks burn dropped items and are removed after the lifetime.
      place-fire: true
      fire-lifetime-ticks: 180

      # Real AreaEffectCloud entities with DRAGON_BREATH and instant damage.
      create-dragon-breath-clouds: true
      cloud-interval-ticks: 20
      cloud-radius: 3.5
      cloud-duration-ticks: 100
      cloud-wait-ticks: 0
      cloud-reapplication-delay-ticks: 10
      cloud-instant-damage-amplifier: 0

  phantoms:
    # Every confirmed landing creates one flock. The flock size is randomly
    # selected between these two values, while maximum-active limits all living
    # dragon-owned phantoms for one primary dragon.
    flock-size-min: 5
    flock-size-max: 6
    maximum-active: 12

    # Real Phantom size values. Only phantoms marked by this module use them;
    # naturally spawned phantoms are never modified.
    size-min: 1
    size-max: 3
    health: 20.0
    attack-damage: 6.0

    # Spawn around the real exit portal and circle above it between swoops.
    spawn-radius: 7.0
    spawn-height: 12.0
    anchor-height: 18.0
    anchor-reset-period-ticks: 40

    # A LAND_ON_PORTAL phase begins while the dragon is still flying from far
    # away. Spawning is allowed only after it is physically close to the real
    # exit portal for the configured number of distinct monitor samples.
    landing-monitor-period-ticks: 5
    landing-horizontal-radius: 8.0
    landing-vertical-radius: 16.0
    landing-confirmation-samples: 2

    # Vanilla phantom AI performs the actual circling and dives. The controller
    # only refreshes a valid player target and keeps the flock near the portal.
    controller-period-ticks: 5
    target-refresh-period-ticks: 20
    target-range: 72.0

    # Folia does not support scoreboard teams, so marked dragon phantoms use a
    # dense purple particle aura instead of a colored glowing outline. Ordinary
    # phantoms are never changed.
    aura:
      period-ticks: 5
      purple-dust-particles: 8
      dragon-breath-particles: 6
      witch-particles: 3
      portal-particles: 4

