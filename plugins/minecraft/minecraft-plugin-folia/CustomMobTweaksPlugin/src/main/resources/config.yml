# CustomMobTweaks 2.2.0
# Target: Folia 26.1.2 / Java 25.
# 20 ticks = 1 second.
# Damage is measured in health points: 2.0 = one heart.
# Chances use fractions: 0.05 = 5%, 0.50 = 50%, 1.0 = 100%.

# -----------------------------------------------------------------------------
# Blaze: real lightning, longer burning, richer loot.
# -----------------------------------------------------------------------------
blaze-fireball-lightning:
  enabled: true
  effect-only: false
  fire-ticks: 100

# -----------------------------------------------------------------------------
# Bogged: Wither II arrows plus poison/bleeding puddles that empower mobs.
# -----------------------------------------------------------------------------
bogged-arrow-wither:
  enabled: true
  duration-ticks: 100
  amplifier: 1

harder-bogged:
  enabled: true
  bleeding-duration-ticks: 160
  poison-duration-ticks: 80
  particle-spawn-interval-ticks: 8
  blood-particle-duration-ticks: 160
  puddle-check-period-ticks: 4
  puddle-trigger-radius: 1.5
  mob-buff-duration-ticks: 300
  mob-size-multiplier: 1.5
  mob-damage-multiplier: 2.0

# -----------------------------------------------------------------------------
# Wither skeleton: hard three-second stun with weakness and darkness.
# -----------------------------------------------------------------------------
wither-skeleton-stun:
  enabled: true
  duration-ticks: 60
  slowness-amplifier: 10
  apply-weakness: true
  apply-darkness: true

# -----------------------------------------------------------------------------
# Snow golem: every hit slows, plus one point of bonus damage.
# -----------------------------------------------------------------------------
snow-golem-snowball:
  enabled: true
  damage: 1.0
  slowness-chance: 1.0
  slowness-duration-ticks: 40
  slowness-amplifier: 1

# -----------------------------------------------------------------------------
# Breeze: maximum pressure and control, but only moderate direct damage.
# -----------------------------------------------------------------------------
breeze-wind-charge:
  enabled: true
  bonus-damage: 1.0
  vertical-knockback: 0.8
  spawn-cloud-particles: true

breeze-fireball-primary:
  enabled: true
  projectile-speed-multiplier: 1.4
  bonus-damage: 1.0
  fire-ticks: 80
  incendiary: false

harder-breeze:
  enabled: true
  attack-cooldown-ticks: 6
  attack-range: 32.0
  projectile-speed: 2.0
  require-line-of-sight: true

  projectile-rain-amount: 10
  projectile-rain-radius: 5.0
  projectile-rain-height: 12.0
  projectile-rain-speed: 0.8
  projectile-rain-duration-ticks: 100
  projectile-rain-period-ticks: 8

  explosion-radius: 5.0
  explosion-knockback: 3.5
  explosion-damage: 1.0


# -----------------------------------------------------------------------------
# Drowned: two minutes of glowing after a trident hit.
# -----------------------------------------------------------------------------
drowned-trident-glow:
  enabled: true
  duration-ticks: 2400
  amplifier: 0

# -----------------------------------------------------------------------------
# Pillager: full armor/protection penetration, no bonus damage.
# -----------------------------------------------------------------------------
pillager-armor-pierce:
  enabled: true
  ignore-armor: true
  ignore-protection-enchants: true
  bonus-damage: 0.0

# -----------------------------------------------------------------------------
# Stray: 1.5 seconds of strong chill and one half-heart maximum-health loss.
# The maximum health is restored when the effect ends.
# -----------------------------------------------------------------------------
stray-chill:
  enabled: true
  duration-ticks: 30
  amplifier: 3

harder-stray:
  enabled: true
  freeze-duration-ticks: 30
  freeze-damage-interval-ticks: 30
  slowness-amplifier: 4
  particle-density: 20
  use-max-health-reduction: true
  max-health-reduction-per-interval: 1.0
  direct-damage-per-interval: 0.0

# -----------------------------------------------------------------------------
# Skeleton sniper: applies ONLY to the normal vanilla SKELETON.
# Strays, Bogged and Wither Skeletons keep their vanilla arrow speed/trajectory.
# A shield can still block the arrow.
# -----------------------------------------------------------------------------
skeleton-sniper:
  enabled: true
  follow-range: 64.0
  minimum-distance: 0.0
  preferred-distance: 32.0
  retreat-when-close: true
  retreat-strength: 0.45
  speed-multiplier: 0.3
  base-damage-bonus: 0.0
  far-shot-damage-bonus: 0.0
  prediction-factor: 1.0
  require-line-of-sight: true
  disable-arrow-gravity: true
  critical: false
  aim-at-body: true
  continuous-homing: true
  homing-ticks: 200
  homing-turn-rate: 0.90
  homing-lead-factor: 0.95
  max-track-distance: 96.0

# -----------------------------------------------------------------------------
# Creaking: much faster, lethal melee hit, large darkness aura.
# -----------------------------------------------------------------------------
harder-creaking:
  enabled: true
  speed-amplifier: 14
  hit-damage: 28.0
  blindness-duration-ticks: 160
  darkness-radius: 20.0
  darkness-duration-ticks: 80
  darkness-check-period-ticks: 10

# -----------------------------------------------------------------------------
# Armadillo: very large and powerful defensive sphere.
# -----------------------------------------------------------------------------
harder-armadillo:
  enabled: true
  base-sphere-radius: 16.0
  radius-per-20-percent-health-loss: 8.0
  sphere-duration-ticks: 240
  check-period-ticks: 2
  particle-density: 50
  push-force: 4.0

# -----------------------------------------------------------------------------
# Illusioner: 1% replacement chance and 1% periodic chance per check/player.
# -----------------------------------------------------------------------------
illusioner-spawn:
  enabled: true
  replace-natural-hostile-mobs: true
  replacement-chance: 0.01
  give-bow: true
  health-multiplier: 2.0
  periodic-check-interval-ticks: 600
  periodic-spawn:
    enabled: true
    chance-per-check: 0.01
    min-radius: 24
    max-radius: 56
    max-block-light: 7
    no-other-illusioner-radius: 64.0

# -----------------------------------------------------------------------------
# Illusioner recursive clones. Each shot creates one one-health copy.
# Generation lifetimes: 15, 13, 11, 9, 7, 5 and 3 seconds.
# The whole family is hard-capped at 30 active copies per original.
# -----------------------------------------------------------------------------
illusioner-clones:
  enabled: true
  verbose-logs: false
  clones-per-shot: 1
  max-active-per-original: 30
  max-generation: 7

  max-health: 1.0
  damage-multiplier: 0.35

  base-lifetime-ticks: 300
  lifetime-reduction-per-generation-ticks: 40
  minimum-lifetime-ticks: 60

  spawn-min-radius: 1.5
  spawn-max-radius: 3.5
  spawn-location-attempts: 10
  spawn-particles: 30
  dissolve-particles: 24

  original-death-delay-ticks: 40

# -----------------------------------------------------------------------------
# Trident zombie: three times the normal health and stronger ranged pressure.
# -----------------------------------------------------------------------------
trident-zombie:
  enabled: true
  spawn-chance: 0.03
  health-multiplier: 3.0
  damage-multiplier: 1.5
  speed-multiplier: 1.15
  attack-range: 24.0
  attack-cooldown-ticks: 35
  trident-speed: 1.6
  trident-damage: 8.0
  require-line-of-sight: true

# -----------------------------------------------------------------------------
# Every snowball fully stops its target for half a second.
# -----------------------------------------------------------------------------
freezing-snowball:
  enabled: true
  players-only: false
  freeze-duration-ticks: 10
  slowness-amplifier: 10
  mining-fatigue-amplifier: 3
  particle-density: 20

# -----------------------------------------------------------------------------
# Lava and armor: unchanged.
# -----------------------------------------------------------------------------
lava-damage:
  enabled: true
  check-period-ticks: 10
  armor-damage-interval-ticks: 20
  regular-armor-damage: 50
  netherite-health-damage: 4.0
  netherite-item-melt-interval-ticks: 40
  netherite-repair-amount: 10
  particle-density: 15
  notify-item-melt: true

# -----------------------------------------------------------------------------
# Dry weapon: always consumes exactly one ammo item.
# Other values are tuned for a powerful but not instant-kill utility weapon.
# -----------------------------------------------------------------------------
dry-weapon:
  enabled: true
  weapon-durability: 250
  long-range-damage: 3.0
  short-range-damage: 1.5
  max-range: 14.0
  ray-size: 0.35
  min-ammo-cost: 1
  max-ammo-cost: 1
  craft-fail-chance: 0.05
  min-fire-rate: 2
  max-fire-rate: 4
  leaf-hit-tracking-duration-ticks: 800
  tornado-minimum-hits: 4
  tornado-chance: 0.25
  tornado-lift-per-2-hits: 2
  tornado-max-lift-blocks: 35
  fire-effect-chance: 0.20
  fire-effect-duration-ticks: 80
  splinter-effect-chance: 0.25
  splinter-effect-duration-ticks: 120
  durability-damage-chance: 0.20
  item-durability-damage: 6

# -----------------------------------------------------------------------------
# Happy ghast bomber: disabled completely.
# -----------------------------------------------------------------------------
happy-ghast-bomber:
  enabled: false
  slow-drop-interval-ticks: 20
  fast-drop-interval-ticks: 20
  fast-mode-min-tnt: 10
  min-tnt-cost: 1
  max-tnt-cost: 5
  projectile-count: 5
  projectile-spread: 2.0
  projectile-speed: 0.8

# -----------------------------------------------------------------------------
# Extra loot.
# -----------------------------------------------------------------------------
extra-loot:
  breeze:
    enabled: true
    killed-by-player-only: true
    drops:
      breeze-rods:
        material: BREEZE_ROD
        chance: 1.0
        min-amount: 4
        max-amount: 12
      # 5% chance for every player-attributed Breeze kill.
      elytra:
        material: ELYTRA
        chance: 0.05
        looting-bonus-per-level: 0.0
        min-amount: 1
        max-amount: 1
      netherite-scrap:
        material: NETHERITE_SCRAP
        chance: 0.08
        looting-bonus-per-level: 0.01
        min-amount: 1
        max-amount: 2

  trident-zombie:
    enabled: true
    killed-by-player-only: true
    drops:
      trident:
        material: TRIDENT
        chance: 0.15
        looting-bonus-per-level: 0.02
        min-amount: 1
        max-amount: 1
      netherite-scrap:
        material: NETHERITE_SCRAP
        chance: 0.03
        min-amount: 1
        max-amount: 1

  creaking:
    enabled: true
    killed-by-player-only: true
    drops:
      resin:
        material: RESIN_CLUMP
        chance: 1.0
        looting-bonus-per-level: 0.0
        min-amount: 8
        max-amount: 16
      pale-oak-logs:
        material: PALE_OAK_LOG
        chance: 0.75
        looting-bonus-per-level: 0.03
        min-amount: 2
        max-amount: 6
      netherite-scrap:
        material: NETHERITE_SCRAP
        chance: 0.03
        min-amount: 1
        max-amount: 1

  bogged:
    enabled: true
    killed-by-player-only: true
    drops:
      spore-blossom:
        material: SPORE_BLOSSOM
        chance: 0.25
        min-amount: 1
        max-amount: 2
      netherite-scrap:
        material: NETHERITE_SCRAP
        chance: 0.025
        min-amount: 1
        max-amount: 1

  stray:
    enabled: true
    killed-by-player-only: true
    drops:
      blue-ice:
        material: BLUE_ICE
        chance: 0.25
        min-amount: 1
        max-amount: 4
      echo-shard:
        material: ECHO_SHARD
        chance: 0.04
        min-amount: 1
        max-amount: 1

  armadillo:
    enabled: true
    killed-by-player-only: true
    drops:
      scutes:
        material: ARMADILLO_SCUTE
        chance: 0.70
        min-amount: 2
        max-amount: 5
      netherite-scrap:
        material: NETHERITE_SCRAP
        chance: 0.01
        min-amount: 1
        max-amount: 1

  illusioner:
    enabled: true
    killed-by-player-only: true
    drops:
      golden-apple:
        material: GOLDEN_APPLE
        chance: 1.0
        min-amount: 1
        max-amount: 1
      # The current extra-loot engine can only create a bare Material ItemStack.
      # A real Potion of Invisibility needs potion metadata and therefore a code update.
      # Do not enable a plain POTION here: it would only be a water bottle.
      invisibility-potion-placeholder:
        enabled: false
        material: POTION
        chance: 1.0
        min-amount: 1
        max-amount: 1

  drowned:
    enabled: true
    killed-by-player-only: true
    drops:
      trident:
        material: TRIDENT
        chance: 0.08
        looting-bonus-per-level: 0.01
        min-amount: 1
        max-amount: 1

  blaze:
    enabled: true
    killed-by-player-only: true
    drops:
      blaze-rods:
        material: BLAZE_ROD
        chance: 0.70
        looting-bonus-per-level: 0.03
        min-amount: 5
        max-amount: 5
      fire-charge:
        material: FIRE_CHARGE
        chance: 0.50
        looting-bonus-per-level: 0.02
        min-amount: 1
        max-amount: 1
      netherite-scrap:
        material: NETHERITE_SCRAP
        chance: 0.02
        min-amount: 1
        max-amount: 1

  wither-skeleton:
    enabled: true
    killed-by-player-only: true
    drops:
      skull:
        material: WITHER_SKELETON_SKULL
        chance: 0.08
        looting-bonus-per-level: 0.01
        min-amount: 1
        max-amount: 1
      netherite-scrap:
        material: NETHERITE_SCRAP
        chance: 0.04
        min-amount: 1
        max-amount: 1

  pillager:
    enabled: true
    killed-by-player-only: true
    drops:
      emeralds:
        material: EMERALD
        chance: 0.20
        min-amount: 1
        max-amount: 5
      totem:
        material: TOTEM_OF_UNDYING
        chance: 0.01
        min-amount: 1
        max-amount: 1

  snow-golem:
    enabled: false
    killed-by-player-only: true
    drops:
      packed-ice:
        material: PACKED_ICE
        chance: 0.25
        min-amount: 1
        max-amount: 3

  happy-ghast:
    enabled: false
    killed-by-player-only: true
    drops:
      wind-charges:
        material: WIND_CHARGE
        chance: 0.50
        min-amount: 2
        max-amount: 8
      ghast-tears:
        material: GHAST_TEAR
        chance: 0.25
        min-amount: 1
        max-amount: 3
      netherite-scrap:
        material: NETHERITE_SCRAP
        chance: 0.01
        min-amount: 1
        max-amount: 1

  skeleton-sniper:
    enabled: true
    killed-by-player-only: true
    drops:
      spectral-arrows:
        material: SPECTRAL_ARROW
        chance: 0.30
        min-amount: 2
        max-amount: 10
      netherite-scrap:
        material: NETHERITE_SCRAP
        chance: 0.015
        min-amount: 1
        max-amount: 1

messages:
  debug: true
