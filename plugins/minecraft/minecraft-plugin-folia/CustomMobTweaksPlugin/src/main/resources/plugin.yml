name: CustomMobTweaks
version: 2.3.0
main: me.vasya.custommobtweaks.CustomMobTweaksPlugin
api-version: '26.1.2'
folia-supported: true
authors: [Vasya]
description: Folia-safe hostile mob upgrades, Ender Dragon rework and configurable extra loot.

commands:
  custommobtweaks:
    description: CustomMobTweaks administration and Happy Ghast bomber controls
    usage: /custommobtweaks <reload|refresh|modules|status|bomber>
    aliases: [cmt, mobtweaks]

permissions:
  custommobtweaks.admin:
    description: Reload and inspect CustomMobTweaks
    default: op
  custommobtweaks.bomber:
    description: Use Happy Ghast bomber mode
    default: true
