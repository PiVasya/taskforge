# These names match the namespace worlds registered by the Worlds plugin.
lobby-world: "minecraft:overworld"
survival-world: "owp:overworld"

# Worlds/worlds.dat is the source of truth on the production server.
# Keep creation disabled so this helper cannot accidentally create a vanilla
# replacement for owp:/ice:/origen:/substratum:/vanilla:/terra: dimensions.
allow-world-creation: false
autoload-survival-on-start: false

lobby-spawn:
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

survival-spawn:
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0
