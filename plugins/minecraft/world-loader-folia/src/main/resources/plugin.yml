name: WorldLoaderFolia
version: 1.1.0
main: com.example.worldloader.WorldLoaderFolia
api-version: "26.1.2"
folia-supported: true
softdepend: [Worlds, Terra, Portals]
commands:
  loadworld:
    description: Resolve an already registered world by exact name or namespace key.
    usage: /loadworld <world>
    permission: worldloader.load
  tpsurv:
    description: Teleport you to the survival world.
    usage: /tpsurv
    permission: worldloader.tp
  tplobby:
    description: Teleport you to the lobby (world) world.
    usage: /tplobby
    permission: worldloader.tp
permissions:
  worldloader.load:
    default: op
  worldloader.tp:
    default: op
