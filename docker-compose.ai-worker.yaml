# Compatibility compose file for the current external Agent worker.
# Legacy Ollama/taskforge-ai-worker settings were removed from the runtime.
services:
  taskforge-ai-worker-external:
    image: ${TASKFORGE_EXTERNAL_AI_IMAGE:-ghcr.io/pivasya/taskforge-ai-worker-external:latest}
    pull_policy: always
    container_name: taskforge-ai-worker-external
    environment:
      TZ: ${TZ:-Europe/Warsaw}

      TASKFORGE_AGENT_API_BASE_URL: ${TASKFORGE_AGENT_API_BASE_URL:-http://api:8080}
      TASKFORGE_AGENT_INTERNAL_KEY: ${TASKFORGE_AGENT_INTERNAL_KEY:-${API_INTERNAL_KEY:-}}
      TASKFORGE_AGENT_WORKER_ID: ${TASKFORGE_AGENT_WORKER_ID:-taskforge-ai-worker-external}
      TASKFORGE_AGENT_POLL_SECONDS: ${TASKFORGE_AGENT_POLL_SECONDS:-5}
      TASKFORGE_AGENT_HEARTBEAT_SECONDS: ${TASKFORGE_AGENT_HEARTBEAT_SECONDS:-15}
      TASKFORGE_AGENT_IDLE_LOG_SECONDS: ${TASKFORGE_AGENT_IDLE_LOG_SECONDS:-60}
      TASKFORGE_AGENT_REQUEST_TIMEOUT_SECONDS: ${TASKFORGE_AGENT_REQUEST_TIMEOUT_SECONDS:-30}
      TASKFORGE_AGENT_MAX_JOB_SECONDS: ${TASKFORGE_AGENT_MAX_JOB_SECONDS:-900}

      TASKFORGE_EXTERNAL_AI_PROVIDER: ${TASKFORGE_EXTERNAL_AI_PROVIDER:-openai_compatible}
      TASKFORGE_EXTERNAL_AI_BASE_URL: ${TASKFORGE_EXTERNAL_AI_BASE_URL:-https://openrouter.ai/api/v1}
      TASKFORGE_EXTERNAL_AI_API_KEY: ${TASKFORGE_EXTERNAL_AI_API_KEY}
      TASKFORGE_EXTERNAL_AI_MODEL: ${TASKFORGE_EXTERNAL_AI_MODEL:-qwen/qwen3.6-plus}
      TASKFORGE_EXTERNAL_AI_TEMPERATURE: ${TASKFORGE_EXTERNAL_AI_TEMPERATURE:-0.12}
      TASKFORGE_EXTERNAL_AI_TOP_P: ${TASKFORGE_EXTERNAL_AI_TOP_P:-0.85}
      TASKFORGE_EXTERNAL_AI_TIMEOUT_SECONDS: ${TASKFORGE_EXTERNAL_AI_TIMEOUT_SECONDS:-180}
      TASKFORGE_EXTERNAL_AI_REQUEST_ATTEMPTS: ${TASKFORGE_EXTERNAL_AI_REQUEST_ATTEMPTS:-5}
      TASKFORGE_EXTERNAL_AI_RETRY_BACKOFF_SECONDS: ${TASKFORGE_EXTERNAL_AI_RETRY_BACKOFF_SECONDS:-12}
      TASKFORGE_EXTERNAL_AI_EXTRA_HEADERS: ${TASKFORGE_EXTERNAL_AI_EXTRA_HEADERS:-}

      OPENROUTER_APP_URL: ${OPENROUTER_APP_URL:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-TaskForge}
      OPENROUTER_CATEGORIES: ${OPENROUTER_CATEGORIES:-education,code-generation}
      OPENROUTER_REQUIRE_PARAMETERS: ${OPENROUTER_REQUIRE_PARAMETERS:-true}
      OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-deny}
      OPENROUTER_ZDR: ${OPENROUTER_ZDR:-false}

      TASKFORGE_AI_LOG_DIR: ${TASKFORGE_AI_LOG_DIR:-/app/logs}
      TASKFORGE_AI_LOG_FILE: ${TASKFORGE_AI_LOG_FILE:-/app/logs/openrouter-base.log}
      TASKFORGE_AI_LOG_INCLUDE_PROMPTS: ${TASKFORGE_AI_LOG_INCLUDE_PROMPTS:-false}
      TASKFORGE_AI_LOG_INCLUDE_RESPONSES: ${TASKFORGE_AI_LOG_INCLUDE_RESPONSES:-false}
    depends_on:
      api:
        condition: service_healthy

    volumes:
      - ./logs/taskforge-ai-worker-external:/app/logs
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet:
