services:
  taskforge-ai-worker:
    image: ghcr.io/pivasya/taskforge-ai-worker:latest
    container_name: taskforge-ai-worker
    environment:
      TASKFORGE_API_BASE: ${TASKFORGE_API_BASE}
      TASKFORGE_INTERNAL_KEY: ${TASKFORGE_INTERNAL_KEY}
      TASKFORGE_AI_WORKER_ID: ${TASKFORGE_AI_WORKER_ID:-taskforge-ai-worker-remote}
      TASKFORGE_AI_CAPABILITIES: ${TASKFORGE_AI_CAPABILITIES:-*}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:14b}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      TASKFORGE_AI_TIMEOUT_SECONDS: ${TASKFORGE_AI_TIMEOUT_SECONDS:-180}
      TASKFORGE_AI_COURSE_PROFILE_TIMEOUT_SECONDS: ${TASKFORGE_AI_COURSE_PROFILE_TIMEOUT_SECONDS:-90}
      TASKFORGE_AI_GAP_ANALYSIS_TIMEOUT_SECONDS: ${TASKFORGE_AI_GAP_ANALYSIS_TIMEOUT_SECONDS:-70}
      TASKFORGE_AI_BATCH_PLAN_TIMEOUT_SECONDS: ${TASKFORGE_AI_BATCH_PLAN_TIMEOUT_SECONDS:-70}
      TASKFORGE_AI_BRIEF_TIMEOUT_SECONDS: ${TASKFORGE_AI_BRIEF_TIMEOUT_SECONDS:-90}
      TASKFORGE_AI_REFERENCE_PACK_TIMEOUT_SECONDS: ${TASKFORGE_AI_REFERENCE_PACK_TIMEOUT_SECONDS:-90}
      TASKFORGE_AI_GENERATION_TIMEOUT_SECONDS: ${TASKFORGE_AI_GENERATION_TIMEOUT_SECONDS:-180}
      TASKFORGE_AI_MAX_REFERENCE_ASSIGNMENTS: ${TASKFORGE_AI_MAX_REFERENCE_ASSIGNMENTS:-20}
      TASKFORGE_AI_MIN_PUBLIC_TESTS: ${TASKFORGE_AI_MIN_PUBLIC_TESTS:-2}
      TASKFORGE_AI_MIN_HIDDEN_TESTS: ${TASKFORGE_AI_MIN_HIDDEN_TESTS:-5}
      TASKFORGE_AI_MIN_DESCRIPTION_LEN: ${TASKFORGE_AI_MIN_DESCRIPTION_LEN:-200}
      TASKFORGE_AI_REPAIR_ATTEMPTS: ${TASKFORGE_AI_REPAIR_ATTEMPTS:-2}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-16384}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0.12}
      TASKFORGE_AI_OLLAMA_JSON_MODE: ${TASKFORGE_AI_OLLAMA_JSON_MODE:-true}
      TASKFORGE_AI_COURSE_PROFILE_NUM_PREDICT: ${TASKFORGE_AI_COURSE_PROFILE_NUM_PREDICT:-520}
      TASKFORGE_AI_GAP_ANALYSIS_NUM_PREDICT: ${TASKFORGE_AI_GAP_ANALYSIS_NUM_PREDICT:-420}
      TASKFORGE_AI_BATCH_PLAN_NUM_PREDICT: ${TASKFORGE_AI_BATCH_PLAN_NUM_PREDICT:-420}
      TASKFORGE_AI_BRIEF_NUM_PREDICT: ${TASKFORGE_AI_BRIEF_NUM_PREDICT:-620}
      TASKFORGE_AI_REFERENCE_PACK_NUM_PREDICT: ${TASKFORGE_AI_REFERENCE_PACK_NUM_PREDICT:-620}
      TASKFORGE_AI_GENERATION_NUM_PREDICT: ${TASKFORGE_AI_GENERATION_NUM_PREDICT:-1800}
      TASKFORGE_AI_COURSE_PROFILE_MAX_RETRIES: ${TASKFORGE_AI_COURSE_PROFILE_MAX_RETRIES:-2}
      TASKFORGE_AI_GAP_ANALYSIS_MAX_RETRIES: ${TASKFORGE_AI_GAP_ANALYSIS_MAX_RETRIES:-2}
      TASKFORGE_AI_BATCH_PLAN_MAX_RETRIES: ${TASKFORGE_AI_BATCH_PLAN_MAX_RETRIES:-3}
      TASKFORGE_AI_REFERENCE_PACK_MAX_RETRIES: ${TASKFORGE_AI_REFERENCE_PACK_MAX_RETRIES:-2}
      TASKFORGE_AI_BRIEF_MAX_RETRIES: ${TASKFORGE_AI_BRIEF_MAX_RETRIES:-2}
      TASKFORGE_AI_LOG_DIR: ${TASKFORGE_AI_LOG_DIR:-/app/logs}
      TASKFORGE_AI_LOG_FILE: ${TASKFORGE_AI_LOG_FILE:-/app/logs/worker.log}
      TASKFORGE_AI_JSON_LOG_FILE: ${TASKFORGE_AI_JSON_LOG_FILE:-/app/logs/worker.jsonl}
      TASKFORGE_AI_LOG_LEVEL: ${TASKFORGE_AI_LOG_LEVEL:-INFO}
      TASKFORGE_AI_LOG_INCLUDE_PROMPTS: ${TASKFORGE_AI_LOG_INCLUDE_PROMPTS:-true}
      TASKFORGE_AI_LOG_INCLUDE_RESPONSES: ${TASKFORGE_AI_LOG_INCLUDE_RESPONSES:-true}
    volumes:
      - ./logs/taskforge-ai-worker:/app/logs
    restart: unless-stopped

  ollama:
    profiles: ["with-ollama"]
    image: ollama/ollama:latest
    container_name: taskforge-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    environment:
      OLLAMA_VULKAN: "1"
      OLLAMA_DEBUG: "1"
      GGML_VK_VISIBLE_DEVICES: "0"
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_FLASH_ATTENTION: "true"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  ollama-data:
