# TaskForge compose module: analyzers.yaml
services:
  image-analyzer:
    image: ghcr.io/pivasya/taskforge-image-analyzer:latest
    container_name: taskforge-image-analyzer
    environment:
      TZ: Europe/Warsaw
    expose:
    - '8080'
    networks:
    - appnet
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/ready >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
  code-analyzer:
    image: ghcr.io/pivasya/taskforge-code-analyzer:latest
    container_name: taskforge-code-analyzer
    environment:
      TZ: Europe/Warsaw
    expose:
    - '8080'
    networks:
    - appnet
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -qO- http://localhost:8080/ready >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
