# TaskForge compose module: ai.yaml
# Default AI runtime: .NET TaskForge Agent Runtime V2.
# Legacy Python module is kept as compose/ai-python-deprecated.yaml and is deprecated.
services:
  taskforge-ai-agent-dotnet:
    image: ${TASKFORGE_DOTNET_AI_IMAGE:-ghcr.io/pivasya/taskforge-ai-agent-dotnet:latest}
    pull_policy: always
    container_name: taskforge-ai-agent-dotnet
    environment:
      TZ: Europe/Warsaw

      TaskForgeInternalApi__BaseUrl: ${TASKFORGE_AGENT_API_BASE_URL:-http://api:8080}
      TaskForgeInternalApi__ApiKey: ${TASKFORGE_AGENT_INTERNAL_KEY}
      TaskForgeInternalApi__ClaimBatchDelayMs: ${TASKFORGE_DOTNET_AI_CLAIM_DELAY_MS:-1200}
      TaskForgeInternalApi__HeartbeatSeconds: ${TASKFORGE_DOTNET_AI_HEARTBEAT_SECONDS:-30}
      TaskForgeInternalApi__RequestTimeoutSeconds: ${TASKFORGE_DOTNET_AI_REQUEST_TIMEOUT_SECONDS:-120}

      TaskForgeAgent__Provider: ${TASKFORGE_DOTNET_AI_PROVIDER:-OpenRouter}
      TaskForgeAgent__OpenAiCompatibleBaseUrl: ${TASKFORGE_DOTNET_AI_BASE_URL:-https://openrouter.ai/api/v1}
      TaskForgeAgent__ApiKey: ${TASKFORGE_DOTNET_AI_API_KEY:-${TASKFORGE_EXTERNAL_AI_API_KEY}}
      TaskForgeAgent__Model: ${TASKFORGE_DOTNET_AI_MODEL:-openai/gpt-4o-mini}
      TaskForgeAgent__AgentName: ${TASKFORGE_DOTNET_AI_AGENT_NAME:-TaskForgeCoordinator}
      TaskForgeAgent__MaxJobSeconds: ${TASKFORGE_DOTNET_AI_MAX_JOB_SECONDS:-420}
      TaskForgeAgent__MaxDraftRepairAttempts: ${TASKFORGE_DOTNET_AI_MAX_REPAIR_ATTEMPTS:-2}
      TaskForgeAgent__MaxContextCharacters: ${TASKFORGE_DOTNET_AI_MAX_CONTEXT_CHARS:-36000}
      TaskForgeAgent__IncludeRawModelTextInDebug: ${TASKFORGE_DOTNET_AI_INCLUDE_RAW_MODEL_TEXT:-false}
      TaskForgeAgent__EnableDangerousWriteTools: ${TASKFORGE_DOTNET_AI_ENABLE_DANGEROUS_WRITE_TOOLS:-false}
      TaskForgeAgent__DefaultLanguage: ${TASKFORGE_DOTNET_AI_DEFAULT_LANGUAGE:-ru}
      TaskForgeAgent__OpenRouterHttpReferer: ${OPENROUTER_APP_URL:-https://${DOMAIN}}
      TaskForgeAgent__OpenRouterAppTitle: ${OPENROUTER_APP_TITLE:-TaskForge .NET Agent}

    depends_on:
      api:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
    networks:
    - appnet
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
