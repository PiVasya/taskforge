# TaskForge compose module: edge.yaml
services:
  nginx:
    build:
      context: ./nginx
    container_name: taskforge-nginx
    environment:
    - DOMAIN=${DOMAIN}
    depends_on:
    - front
    - api
    volumes:
    - certbot-www:/var/www/certbot
    - letsencrypt:/etc/letsencrypt
    ports:
    - 80:80
    - 443:443
    networks:
    - appnet
    restart: unless-stopped
  certbot-init:
    image: certbot/certbot:latest
    container_name: taskforge-certbot-init
    environment:
    - DOMAIN=${DOMAIN}
    - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
    - certbot-www:/var/www/certbot
    - letsencrypt:/etc/letsencrypt
    depends_on:
    - nginx
    entrypoint:
    - sh
    - -c
    - "if [ -f \"/etc/letsencrypt/live/$DOMAIN/fullchain.pem\" ]; then\n  echo \"\
      [certbot-init] Certificate already exists for $DOMAIN - skipping\";\nelse\n\
      \  certbot certonly \\\n    --webroot -w /var/www/certbot \\\n    -d \"$DOMAIN\"\
      \ \\\n    --email \"$LETSENCRYPT_EMAIL\" \\\n    --rsa-key-size 4096 --agree-tos\
      \ --no-eff-email --non-interactive;\nfi\n"
    restart: 'no'
    networks:
    - appnet
  certbot-renew:
    image: certbot/certbot:latest
    container_name: taskforge-certbot-renew
    environment:
    - DOMAIN=${DOMAIN}
    volumes:
    - certbot-www:/var/www/certbot
    - letsencrypt:/etc/letsencrypt
    depends_on:
    - nginx
    entrypoint:
    - sh
    - -c
    - "trap : TERM INT\nwhile :; do\n  certbot renew --webroot -w /var/www/certbot\
      \ --quiet\n  sleep 12h\ndone\n"
    restart: unless-stopped
    networks:
    - appnet
volumes:
  certbot-www: null
  letsencrypt: null
