name: WorldLoaderFolia
version: 1.0.0
main: com.example.worldloader.WorldLoaderFolia
api-version: "1.21"
folia-supported: true
commands:
  loadworld:
    description: Load (or create) a world by name.
    usage: /loadworld <world>
    permission: worldloader.load
  tpsurv:
    description: Teleport you to the survival world.
    usage: /tpsurv
    permission: worldloader.tp
  tplobby:
    description: Teleport you to the lobby (world) world.
    usage: /tplobby
    permission: worldloader.tp
permissions:
  worldloader.load:
    default: op
  worldloader.tp:
    default: op
