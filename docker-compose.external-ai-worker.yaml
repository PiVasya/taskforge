services:
  taskforge-ai-worker-external:
    build:
      context: ./taskforge-ai-worker-external
      dockerfile: Dockerfile
    image: taskforge-ai-worker-external:local
    container_name: taskforge-ai-worker-external
    environment:
      TASKFORGE_API_BASE: ${TASKFORGE_API_BASE:-http://api:8080}
      TASKFORGE_INTERNAL_KEY: ${TASKFORGE_INTERNAL_KEY:-${API_INTERNAL_KEY}}
      TASKFORGE_AI_WORKER_ID: ${TASKFORGE_AI_WORKER_ID:-taskforge-ai-worker-external}
      TASKFORGE_AI_CAPABILITIES: ${TASKFORGE_AI_CAPABILITIES:-*}

      TASKFORGE_EXTERNAL_AI_PROVIDER: ${TASKFORGE_EXTERNAL_AI_PROVIDER:-openai_compatible}
      TASKFORGE_EXTERNAL_AI_BASE_URL: ${TASKFORGE_EXTERNAL_AI_BASE_URL:-https://api.openai.com/v1}
      TASKFORGE_EXTERNAL_AI_API_KEY: ${TASKFORGE_EXTERNAL_AI_API_KEY}
      TASKFORGE_EXTERNAL_AI_MODEL: ${TASKFORGE_EXTERNAL_AI_MODEL:-qwen/qwen3.6-plus}
      TASKFORGE_EXTERNAL_AI_TEMPERATURE: ${TASKFORGE_EXTERNAL_AI_TEMPERATURE:-0.12}
      TASKFORGE_EXTERNAL_AI_JSON_MODE: ${TASKFORGE_EXTERNAL_AI_JSON_MODE:-true}
      TASKFORGE_EXTERNAL_AI_REQUEST_ATTEMPTS: ${TASKFORGE_EXTERNAL_AI_REQUEST_ATTEMPTS:-2}
      TASKFORGE_EXTERNAL_AI_RETRY_BACKOFF_SECONDS: ${TASKFORGE_EXTERNAL_AI_RETRY_BACKOFF_SECONDS:-8}
      TASKFORGE_EXTERNAL_AI_EXTRA_HEADERS: ${TASKFORGE_EXTERNAL_AI_EXTRA_HEADERS:-}
      TASKFORGE_EXTERNAL_AI_ANTHROPIC_VERSION: ${TASKFORGE_EXTERNAL_AI_ANTHROPIC_VERSION:-2023-06-01}

      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-10}
      TASKFORGE_AI_TIMEOUT_SECONDS: ${TASKFORGE_AI_TIMEOUT_SECONDS:-180}
      TASKFORGE_AI_COURSE_PROFILE_TIMEOUT_SECONDS: ${TASKFORGE_AI_COURSE_PROFILE_TIMEOUT_SECONDS:-90}
      TASKFORGE_AI_GAP_ANALYSIS_TIMEOUT_SECONDS: ${TASKFORGE_AI_GAP_ANALYSIS_TIMEOUT_SECONDS:-70}
      TASKFORGE_AI_BATCH_PLAN_TIMEOUT_SECONDS: ${TASKFORGE_AI_BATCH_PLAN_TIMEOUT_SECONDS:-70}
      TASKFORGE_AI_BRIEF_TIMEOUT_SECONDS: ${TASKFORGE_AI_BRIEF_TIMEOUT_SECONDS:-90}
      TASKFORGE_AI_REFERENCE_PACK_TIMEOUT_SECONDS: ${TASKFORGE_AI_REFERENCE_PACK_TIMEOUT_SECONDS:-90}
      TASKFORGE_AI_GENERATION_TIMEOUT_SECONDS: ${TASKFORGE_AI_GENERATION_TIMEOUT_SECONDS:-180}
      TASKFORGE_AI_MAX_REFERENCE_ASSIGNMENTS: ${TASKFORGE_AI_MAX_REFERENCE_ASSIGNMENTS:-20}
      TASKFORGE_AI_MIN_PUBLIC_TESTS: ${TASKFORGE_AI_MIN_PUBLIC_TESTS:-2}
      TASKFORGE_AI_MIN_HIDDEN_TESTS: ${TASKFORGE_AI_MIN_HIDDEN_TESTS:-5}
      TASKFORGE_AI_MIN_DESCRIPTION_LEN: ${TASKFORGE_AI_MIN_DESCRIPTION_LEN:-200}
      TASKFORGE_AI_REPAIR_ATTEMPTS: ${TASKFORGE_AI_REPAIR_ATTEMPTS:-2}
      TASKFORGE_AI_DRAFT_SUBSTAGES: ${TASKFORGE_AI_DRAFT_SUBSTAGES:-false}
      TASKFORGE_AI_STRUCTURED_OUTPUTS: ${TASKFORGE_AI_STRUCTURED_OUTPUTS:-true}
      TASKFORGE_AI_ASSISTANT_PREFILL: ${TASKFORGE_AI_ASSISTANT_PREFILL:-true}
      TASKFORGE_AI_SCHEMA_VALIDATION: ${TASKFORGE_AI_SCHEMA_VALIDATION:-strict}
      TASKFORGE_AI_CHAT_STRICT_MODE: ${TASKFORGE_AI_CHAT_STRICT_MODE:-true}
      TASKFORGE_AI_SELECTION_TELEMETRY: ${TASKFORGE_AI_SELECTION_TELEMETRY:-true}
      TASKFORGE_AI_PROVIDER_ORDER_PLANNING: ${TASKFORGE_AI_PROVIDER_ORDER_PLANNING:-anthropic,openai}
      TASKFORGE_AI_PROVIDER_ORDER_CHAT: ${TASKFORGE_AI_PROVIDER_ORDER_CHAT:-openai,anthropic}
      TASKFORGE_AI_PROVIDER_ORDER_DRAFT: ${TASKFORGE_AI_PROVIDER_ORDER_DRAFT:-openai,anthropic}
      TASKFORGE_AI_PROVIDER_ORDER_REPAIR: ${TASKFORGE_AI_PROVIDER_ORDER_REPAIR:-openai,anthropic}
      TASKFORGE_AI_PROVIDER_ORDER_REVIEW: ${TASKFORGE_AI_PROVIDER_ORDER_REVIEW:-openai,anthropic}
      TASKFORGE_AI_STAGE_ROUTING_JSON: ${TASKFORGE_AI_STAGE_ROUTING_JSON:-}
      TASKFORGE_AI_DUPLICATE_SIGNATURES: ${TASKFORGE_AI_DUPLICATE_SIGNATURES:-true}
      TASKFORGE_AI_SIMILARITY_SIGNATURE_WARNING: ${TASKFORGE_AI_SIMILARITY_SIGNATURE_WARNING:-0.66}
      TASKFORGE_AI_SIMILARITY_SIGNATURE_FAIL: ${TASKFORGE_AI_SIMILARITY_SIGNATURE_FAIL:-0.82}
      OPENROUTER_APP_URL: ${OPENROUTER_APP_URL:-}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-TaskForge External AI Worker}
      OPENROUTER_CATEGORIES: ${OPENROUTER_CATEGORIES:-education,code-generation}
      OPENROUTER_PROVIDER_ORDER: ${OPENROUTER_PROVIDER_ORDER:-}
      OPENROUTER_REQUIRE_PARAMETERS: ${OPENROUTER_REQUIRE_PARAMETERS:-true}
      OPENROUTER_ALLOW_FALLBACKS: ${OPENROUTER_ALLOW_FALLBACKS:-true}
      OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-deny}
      OPENROUTER_ZDR: ${OPENROUTER_ZDR:-false}
      OPENROUTER_PLUGINS: ${OPENROUTER_PLUGINS:-response-healing,context-compression}
      TASKFORGE_AI_ROUTE_AWARE_REPAIR: ${TASKFORGE_AI_ROUTE_AWARE_REPAIR:-true}
      TASKFORGE_AI_SANDBOX_RUNNER: ${TASKFORGE_AI_SANDBOX_RUNNER:-false}
      TASKFORGE_AI_SANDBOX_MODE: ${TASKFORGE_AI_SANDBOX_MODE:-process}
      TASKFORGE_AI_RUNNER_RUNTIME: ${TASKFORGE_AI_RUNNER_RUNTIME:-docker}
      TASKFORGE_AI_RUNNER_CONTAINER_IMAGE: ${TASKFORGE_AI_RUNNER_CONTAINER_IMAGE:-taskforge-python-runner:wave4}
      TASKFORGE_AI_RUNNER_NETWORK: ${TASKFORGE_AI_RUNNER_NETWORK:-none}
      TASKFORGE_AI_RUNNER_TMPFS_MB: ${TASKFORGE_AI_RUNNER_TMPFS_MB:-16}
      TASKFORGE_AI_RUNNER_PIDS_LIMIT: ${TASKFORGE_AI_RUNNER_PIDS_LIMIT:-64}
      TASKFORGE_AI_RUNNER_TIMEOUT_SECONDS: ${TASKFORGE_AI_RUNNER_TIMEOUT_SECONDS:-6}
      TASKFORGE_AI_RUNNER_CPU_SECONDS: ${TASKFORGE_AI_RUNNER_CPU_SECONDS:-4}
      TASKFORGE_AI_RUNNER_MEMORY_MB: ${TASKFORGE_AI_RUNNER_MEMORY_MB:-256}
      TASKFORGE_AI_COURSE_PROFILE_NUM_PREDICT: ${TASKFORGE_AI_COURSE_PROFILE_NUM_PREDICT:-520}
      TASKFORGE_AI_GAP_ANALYSIS_NUM_PREDICT: ${TASKFORGE_AI_GAP_ANALYSIS_NUM_PREDICT:-420}
      TASKFORGE_AI_BATCH_PLAN_NUM_PREDICT: ${TASKFORGE_AI_BATCH_PLAN_NUM_PREDICT:-420}
      TASKFORGE_AI_BRIEF_NUM_PREDICT: ${TASKFORGE_AI_BRIEF_NUM_PREDICT:-620}
      TASKFORGE_AI_REFERENCE_PACK_NUM_PREDICT: ${TASKFORGE_AI_REFERENCE_PACK_NUM_PREDICT:-620}
      TASKFORGE_AI_GENERATION_NUM_PREDICT: ${TASKFORGE_AI_GENERATION_NUM_PREDICT:-1800}
      TASKFORGE_AI_COURSE_PROFILE_MAX_RETRIES: ${TASKFORGE_AI_COURSE_PROFILE_MAX_RETRIES:-2}
      TASKFORGE_AI_GAP_ANALYSIS_MAX_RETRIES: ${TASKFORGE_AI_GAP_ANALYSIS_MAX_RETRIES:-2}
      TASKFORGE_AI_BATCH_PLAN_MAX_RETRIES: ${TASKFORGE_AI_BATCH_PLAN_MAX_RETRIES:-3}
      TASKFORGE_AI_REFERENCE_PACK_MAX_RETRIES: ${TASKFORGE_AI_REFERENCE_PACK_MAX_RETRIES:-2}
      TASKFORGE_AI_BRIEF_MAX_RETRIES: ${TASKFORGE_AI_BRIEF_MAX_RETRIES:-2}
      TASKFORGE_AI_LOG_DIR: ${TASKFORGE_AI_LOG_DIR:-/app/logs}
      TASKFORGE_AI_LOG_FILE: ${TASKFORGE_AI_LOG_FILE:-/app/logs/worker.log}
      TASKFORGE_AI_JSON_LOG_FILE: ${TASKFORGE_AI_JSON_LOG_FILE:-/app/logs/worker.jsonl}
      TASKFORGE_AI_LOG_LEVEL: ${TASKFORGE_AI_LOG_LEVEL:-INFO}
      TASKFORGE_AI_LOG_INCLUDE_PROMPTS: ${TASKFORGE_AI_LOG_INCLUDE_PROMPTS:-false}
      TASKFORGE_AI_DUPLICATE_CLUSTERING: ${TASKFORGE_AI_DUPLICATE_CLUSTERING:-true}
      TASKFORGE_AI_DUPLICATE_CLUSTER_THRESHOLD: ${TASKFORGE_AI_DUPLICATE_CLUSTER_THRESHOLD:-0.72}
      TASKFORGE_AI_OPENROUTER_USAGE_TELEMETRY: ${TASKFORGE_AI_OPENROUTER_USAGE_TELEMETRY:-true}
      TASKFORGE_AI_LOG_INCLUDE_RESPONSES: ${TASKFORGE_AI_LOG_INCLUDE_RESPONSES:-false}
    volumes:
      - ./logs/taskforge-ai-worker-external:/app/logs
    restart: unless-stopped
