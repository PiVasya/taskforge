# HTTP: challenge + редирект на HTTPS
server {
  listen 80;
  server_name ${DOMAIN} ${CT_DOMAIN};

  location ^~ /.well-known/acme-challenge/ {
    alias /var/www/certbot/.well-known/acme-challenge/;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: основной фронт TaskForge
server {
  listen 443 ssl;
  http2 on;
  server_name ${DOMAIN};

  # Сертификат выпускается certbot-ом на ${DOMAIN} и ${CT_DOMAIN}
  ssl_certificate           /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key       /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  add_header Strict-Transport-Security "max-age=31536000" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location /api/learning/ {
    proxy_pass http://learning-content-service:8080;
  }

  location /api/quiz/ {
    proxy_pass http://quiz-task-service:8080;
  }

  location /api/ {
    proxy_pass http://api:8080;
  }

  location /hubs/ {
    proxy_pass http://api:8080;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://front:80;
  }
}

# HTTPS: второй фронт CT Macha
