<!DOCTYPE html>
<html lang="en">
   <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Заголовок вкладки и базовый тайтл сайта -->
    <title>TaskForge — платформа задач по программированию</title>

    <!-- Описание для поисковиков -->
    <meta
      name="description"
      content="TaskForge — учебная платформа для задач по программированию: курсы, задания, автопроверка решений и рейтинг студентов."
    />

    <!-- Цвет темы для мобильных браузеров -->
    <meta name="theme-color" content="#020617" />

    <!-- Иконки сайта -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />

    <!-- Open Graph / превью при шаринге -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TaskForge — платформа задач по программированию" />
    <meta
      property="og:description"
      content="Решай задачи, сдавай лабораторные, смотри результаты и рейтинг — всё в одном месте."
    />
    <meta
      property="og:image"
      content="%PUBLIC_URL%/og-image.png"
    />
    <!-- тут подставь свой реальный домен -->
    <meta
      property="og:url"
      content="https://taskforge.by"
    />

    <!-- Можно добавить twitter-карточку, если нужно -->
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
