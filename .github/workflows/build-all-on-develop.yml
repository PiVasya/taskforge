name: Build & Push (all on develop)

on:
  push:
    branches: [ develop ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            path: taskforge
            image: taskforge-api
          - name: front
            path: clientapp
            image: taskforge-front
          - name: python-runner
            path: python-runner
            image: taskforge-python-runner
          - name: cpp-runner
            path: cpp-runner
            image: taskforge-cpp-runner
          - name: csharp-runner
            path: csharp-runner
            image: taskforge-csharp-runner
          - name: javascript-runner
            path: javascript-runner
            image: taskforge-javascript-runner
          - name: pascal-runner
            path: pascal-runner
            image: taskforge-pascal-runner
          - name: java-runner
            path: java-runner
            image: taskforge-java-runner
          # New service: support-bot. This will build and push the container
          # defined in support-bot/Dockerfile. The resulting image is
          # published as ghcr.io/<owner>/taskforge-support-bot.
          - name: support-bot
            path: support-bot
            image: taskforge-support-bot

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # Verify that a Dockerfile exists for the component. If it is missing,
      # fail the job to avoid pushing an empty image. This also prints
      # helpful debugging information about the working directory and
      # available files.
      - name: Debug & verify Dockerfile exists
        shell: bash
        run: |
          echo "PWD=$(pwd)"
          echo "=== ROOT ==="
          ls -al
          echo "=== MATRIX PATH: ${{ matrix.path }} ==="
          ls -al "${{ matrix.path }}" || true
          echo "=== FIND Dockerfile (depth 3) ==="
          find . -maxdepth 3 -type f -name Dockerfile -print
          FILE="${{ matrix.path }}/Dockerfile"
          if [ ! -f "$FILE" ]; then
            echo "::error::Dockerfile not found at $FILE"
            exit 1
          fi
          echo "OK: Using $FILE"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=ref,event=branch
          labels: |
            org.opencontainers.image.source=${{ github.repository }}

      # Determine the correct build context and Dockerfile for each service.
      - name: Set build variables
        id: set-vars
        run: |
          if [ "${{ matrix.name }}" = "support-bot" ]; then
            echo "context=." >> $GITHUB_OUTPUT
            echo "dockerfile=./support-bot/Dockerfile" >> $GITHUB_OUTPUT
          else
            echo "context=./${{ matrix.path }}" >> $GITHUB_OUTPUT
            echo "dockerfile=./${{ matrix.path }}/Dockerfile" >> $GITHUB_OUTPUT
          fi

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.set-vars.outputs.context }}
          file: ${{ steps.set-vars.outputs.dockerfile }}
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max