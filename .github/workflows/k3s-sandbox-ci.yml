name: TaskForge K3s | Quality Gate & Container Release

# Builds the isolated K3s lab branch (currently cluster-v2), never develop/main.
# It never deploys onto TaskForge production hosts and never publishes :develop/:latest.
on:
  push:
    branches:
      - 'cluster-v2'
      - 'k3s-*'
      - 'k3s/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k3s-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k3s-manifests:
    name: 01 | Repository & Kubernetes validation
    if: github.ref == 'refs/heads/cluster-v2' || startsWith(github.ref, 'refs/heads/k3s-') || startsWith(github.ref, 'refs/heads/k3s/')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify isolated branch content
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci/check-k3s-branch-layout.py
      - name: Verify CI triggers and release boundaries
        run: python3 scripts/ci/check-k3s-workflow-trigger.py
      - name: Validate Docker build contexts
        run: python3 scripts/ci/check-k3s-docker-context.py
      - name: Validate EF migration jobs and YSQL compatibility
        run: python3 scripts/ci/check-k3s-migration-contract.py
      - name: Validate durable admin feed ownership and no map presence
        run: python3 scripts/ci/check-admin-solution-feed.py
      - name: Test Kubernetes manifest generation
        run: node --test tools/k3s/local/local.test.mjs tools/k3s/local/sandbox.test.mjs
      - name: Regression-test CI database readiness and failure reporting
        run: python3 scripts/ci/test-yugabyte-smoke.py
      - name: Validate shell scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          for f in infrastructure/k8s/taskforge-yugabyte/local/*.sh scripts/ci/yugabyte-smoke.sh; do bash -n "$f"; done
      - name: Generate Kubernetes manifests
        run: node tools/k3s/local/generate.mjs core "$RUNNER_TEMP/tf-k3s"
      - name: Validate Kubernetes resource isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'tf-k3s'
          for f in sorted(p.glob('*.json.yaml')):
              resources=[json.loads(x) for x in f.read_text().strip().split('\n---\n')]
              assert resources, f
              for r in resources:
                  name=r['metadata']['name']
                  ns=r['metadata'].get('namespace')
                  assert ns=='taskforge-k3s-lab' or r['kind']=='Namespace', (name,ns)
                  if r['kind']=='Service':
                      assert r['spec'].get('type','ClusterIP')=='ClusterIP',name
                  if r['kind']=='Deployment':
                      assert r['spec']['replicas']==1,name
          print('PASS: sandbox Kubernetes resources only; ClusterIP; no public LoadBalancer')
          PY
      - name: Publish validation report
        if: success()
        shell: bash
        run: |
          {
            echo '### Repository & Kubernetes validation'
            echo '- Experiment-only branch and CI release boundaries confirmed.'
            echo '- No legacy production infrastructure or retired components detected.'
            echo '- Kubernetes manifests validated for local-only namespaces and ClusterIP.'
            echo '- Docker source coverage and EF migration job contracts validated.'
          } >> "$GITHUB_STEP_SUMMARY"

  dotnet-build:
    name: 02 | .NET API - ${{ matrix.service }}
    if: github.ref == 'refs/heads/cluster-v2' || startsWith(github.ref, 'refs/heads/k3s-') || startsWith(github.ref, 'refs/heads/k3s/')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity-api
            project: services/identity/api/TaskForge.Identity.Api.csproj
          - service: education-api
            project: services/education/api/TaskForge.Education.Api.csproj
          - service: content-api
            project: services/content/api/learning-content-service.csproj
          - service: tasks-api
            project: services/tasks/assignment-api/TaskForge.Tasks.Api.csproj
          - service: solutions-api
            project: services/solutions/api/TaskForge.Solutions.Api.csproj
          - service: execution-api
            project: services/execution/api/TaskForge.Execution.Api.csproj
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Compile and publish .NET 10 application
        run: dotnet publish "${{ matrix.project }}" -c Release -o "${{ runner.temp }}/${{ matrix.service }}" /p:UseAppHost=false
      - name: Execute API test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${{ matrix.service }}" in
            identity-api) test_project=services/identity/api/tests/TaskForge.Identity.Api.Tests/TaskForge.Identity.Api.Tests.csproj ;;
            education-api) test_project=services/education/api/tests/TaskForge.Education.Api.Tests/TaskForge.Education.Api.Tests.csproj ;;
            tasks-api) test_project=services/tasks/assignment-api/tests/TaskForge.Tasks.Api.Tests/TaskForge.Tasks.Api.Tests.csproj ;;
            solutions-api) test_project=services/solutions/api/tests/TaskForge.Solutions.Api.Tests/TaskForge.Solutions.Api.Tests.csproj ;;
            execution-api) test_project=services/execution/api/tests/TaskForge.Execution.Api.Tests/TaskForge.Execution.Api.Tests.csproj ;;
            content-api) exit 0 ;;
            *) echo "Unknown test project" >&2; exit 1 ;;
          esac
          dotnet test "$test_project" -c Release --logger 'trx;LogFileName=tests.trx' \
            --results-directory "${{ runner.temp }}/${{ matrix.service }}-tests"
      - name: Report API build and test results
        if: success()
        shell: bash
        run: |
          {
            echo '### API: ${{ matrix.service }}'
            echo '- .NET 10 Release publication: passed.'
            echo '- Service test suite: passed (where available).'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve failed test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: k3s-${{ matrix.service }}-test-results
          path: ${{ runner.temp }}/${{ matrix.service }}-tests/
          if-no-files-found: ignore

  frontend:
    name: 02 | React application
    if: github.ref == 'refs/heads/cluster-v2' || startsWith(github.ref, 'refs/heads/k3s-') || startsWith(github.ref, 'refs/heads/k3s/')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install, test and bundle React application
        working-directory: apps/web
        env:
          REACT_APP_API_BASE: /api
          GENERATE_SOURCEMAP: 'false'
        run: |
          npm ci --no-audit --no-fund
          node --test scripts/*/*.test.mjs
          node scripts/check-architecture.js
          npm run build
      - name: Report frontend validation
        if: success()
        run: |
          {
            echo '### React application'
            echo '- Dependency installation, frontend tests and architecture checks: passed.'
            echo '- Production bundle: built successfully.'
          } >> "$GITHUB_STEP_SUMMARY"

  yugabyte-migrations:
    name: 03 | YugabyteDB - schema & persistence
    needs: k3s-manifests
    if: github.ref == 'refs/heads/cluster-v2' || startsWith(github.ref, 'refs/heads/k3s-') || startsWith(github.ref, 'refs/heads/k3s/')
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    env:
      ASPNETCORE_ENVIRONMENT: Development
      Cluster__MultiNode: 'true'
      Database__RequireYugabyte: 'true'
      Database__MigrationJobOnly: 'true'
      Database__MigrateOnStartup: 'true'
      Database__EnsureCreated: 'false'
      Seed__InitialCatalog: 'false'
      Jwt__Key: 'k3s-sandbox-ci-only-never-for-production-a9c28016e1'
      Jwt__SigningKey: 'k3s-sandbox-ci-only-never-for-production-a9c28016e1'
      Jwt__Issuer: TaskForgeK3sLab
      Jwt__Audience: TaskForgeK3sLab
      InternalApi__Key: 'k3s-sandbox-ci-internal-key-do-not-deploy'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Initialize disposable YugabyteDB and validate YSQL connectivity
        shell: bash
        run: bash scripts/ci/yugabyte-smoke.sh start
      - name: Initialize isolated service databases
        shell: bash
        run: bash scripts/ci/yugabyte-smoke.sh create
      - name: Apply EF Core migrations (six service databases)
        shell: bash
        run: bash scripts/ci/yugabyte-smoke.sh migrate
      - name: Validate schema and read/write operations
        shell: bash
        run: bash scripts/ci/yugabyte-smoke.sh verify
      - name: Capture database diagnostics on failure
        if: failure()
        shell: bash
        run: bash scripts/ci/yugabyte-smoke.sh diagnose
      - name: Upload YugabyteDB diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: taskforge-ysql-diagnostics
          path: ${{ runner.temp }}/taskforge-ysql-diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Destroy disposable database
        if: always()
        shell: bash
        run: bash scripts/ci/yugabyte-smoke.sh cleanup

  docker-build-smoke:
    name: 03 | OCI image build - ${{ matrix.name }}
    needs: k3s-manifests
    if: github.ref == 'refs/heads/cluster-v2' || startsWith(github.ref, 'refs/heads/k3s-') || startsWith(github.ref, 'refs/heads/k3s/')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-api
            context: .
            file: services/identity/api/Dockerfile
          - name: education-api
            context: .
            file: services/education/api/Dockerfile
          - name: content-api
            context: services/content/api
            file: services/content/api/Dockerfile
          - name: tasks-api
            context: .
            file: services/tasks/assignment-api/Dockerfile
          - name: solutions-api
            context: .
            file: services/solutions/api/Dockerfile
          - name: execution-api
            context: .
            file: services/execution/api/Dockerfile
          - name: front
            context: apps/web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build and validate runtime container
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha,scope=k3s-sandbox-${{ matrix.name }}
          cache-to: type=gha,scope=k3s-sandbox-${{ matrix.name }},mode=max

  publish-lab-images:
    name: 04 | GHCR release - ${{ matrix.name }}
    needs: [k3s-manifests, dotnet-build, frontend, yugabyte-migrations, docker-build-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/cluster-v2' || startsWith(github.ref, 'refs/heads/k3s-') || startsWith(github.ref, 'refs/heads/k3s/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity-api
            context: .
            file: services/identity/api/Dockerfile
          - name: education-api
            context: .
            file: services/education/api/Dockerfile
          - name: content-api
            context: services/content/api
            file: services/content/api/Dockerfile
          - name: tasks-api
            context: .
            file: services/tasks/assignment-api/Dockerfile
          - name: solutions-api
            context: .
            file: services/solutions/api/Dockerfile
          - name: execution-api
            context: .
            file: services/execution/api/Dockerfile
          - name: front
            context: apps/web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Resolve isolated registry namespace
        id: owner
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/taskforge-k3s-lab/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=k3s-sandbox-${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Isolated local K3s/YugabyteDB sandbox (NOT production)
      - name: Record published artifact
        if: success()
        run: |
          {
            echo '### Published OCI artifact'
            echo '`ghcr.io/${{ steps.owner.outputs.owner }}/taskforge-k3s-lab/${{ matrix.name }}:${{ github.sha }}`'
            echo ''
            echo 'Isolated experimental image; no production deployment was triggered.'
          } >> "$GITHUB_STEP_SUMMARY"
