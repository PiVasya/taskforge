name: Build & Push Support Bot

on:
  push:
    branches: [ develop ]
    paths:
      - "support-bot/**"
      - "taskforge/**"                 # важно! бот зависит от taskforge.csproj
      - ".github/workflows/build-support-bot.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .                      # КОРЕНЬ РЕПО (иначе не найдёт taskforge)
          file: support-bot/Dockerfile    # Dockerfile бота
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/taskforge-support-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
