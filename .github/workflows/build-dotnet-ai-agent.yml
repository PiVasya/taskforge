name: Build & Push .NET AI Agent

on:
  workflow_dispatch: {}
  push:
    branches: [develop, main, master]
    paths:
      - 'taskforge-ai-agent-dotnet/**'
      - '.github/workflows/build-dotnet-ai-agent.yml'
  pull_request:
    paths:
      - 'taskforge-ai-agent-dotnet/**'
      - '.github/workflows/build-dotnet-ai-agent.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore agent
        run: dotnet restore taskforge-ai-agent-dotnet/TaskForge.AiAgent.csproj

      - name: Restore tests
        run: dotnet restore taskforge-ai-agent-dotnet/tests/TaskForge.AiAgent.Tests/TaskForge.AiAgent.Tests.csproj

      - name: Build agent
        run: dotnet build taskforge-ai-agent-dotnet/TaskForge.AiAgent.csproj -c Release --no-restore

      - name: Test agent
        run: dotnet test taskforge-ai-agent-dotnet/tests/TaskForge.AiAgent.Tests/TaskForge.AiAgent.Tests.csproj -c Release --no-restore

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./taskforge-ai-agent-dotnet
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/taskforge-ai-agent-dotnet:latest
            ghcr.io/${{ env.OWNER_LC }}/taskforge-ai-agent-dotnet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
