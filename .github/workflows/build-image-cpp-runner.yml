name: Build & Push Image CPP Runner

on:
  push:
    branches: [ develop ]
    paths:
      - "image-cpp-runner/**"
      - ".github/workflows/build-image-cpp-runner.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./image-cpp-runner
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/taskforge-image-cpp-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
