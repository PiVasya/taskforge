name: minecraft plugin jars

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: minecraft-plugins-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build TaskForgeLink
        working-directory: plugins/minecraft/minecraft-plugin-folia/TaskForgeFoliaPlugin
        run: gradle --no-daemon clean build

      - name: Build CustomMobTweaks
        working-directory: plugins/minecraft/minecraft-plugin-folia/CustomMobTweaksPlugin
        run: gradle --no-daemon clean build

      - name: Prepare downloadable jars
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/minecraft-plugins
          cp plugins/minecraft/minecraft-plugin-folia/TaskForgeFoliaPlugin/build/libs/TaskForgeFoliaPlugin-*.jar dist/minecraft-plugins/TaskForgeLink.jar
          cp plugins/minecraft/minecraft-plugin-folia/CustomMobTweaksPlugin/build/libs/CustomMobTweaksPlugin-*.jar dist/minecraft-plugins/CustomMobTweaks.jar
          cd dist/minecraft-plugins
          sha256sum *.jar > SHA256SUMS.txt
          zip -9 ../taskforge-minecraft-plugins.zip *.jar SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskforge-minecraft-plugins-${{ github.sha }}
          path: |
            dist/minecraft-plugins/*.jar
            dist/minecraft-plugins/SHA256SUMS.txt
            dist/taskforge-minecraft-plugins.zip
          if-no-files-found: error
          retention-days: 90

      - name: Add build summary
        shell: bash
        run: |
          {
            echo "## Minecraft plugins"
            echo
            echo "- TaskForgeLink.jar"
            echo "- CustomMobTweaks.jar"
            echo "- taskforge-minecraft-plugins.zip"
            echo
            echo "Open this workflow run and download the artifact named \`taskforge-minecraft-plugins-${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish jars in GitHub Release
        if: github.ref_type == 'tag' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi
          gh release upload "$tag" \
            dist/minecraft-plugins/TaskForgeLink.jar \
            dist/minecraft-plugins/CustomMobTweaks.jar \
            dist/minecraft-plugins/SHA256SUMS.txt \
            dist/taskforge-minecraft-plugins.zip \
            --clobber
