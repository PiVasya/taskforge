name: develop selective build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:
    inputs:
      build_all:
        description: Build all images
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway: ['apps/gateway/**']
            front: ['apps/web/**']
            front_ct: ['apps/web-ct/**']
            identity: ['services/identity/**', 'contracts/**']
            education: ['services/education/**', 'contracts/**']
            content: ['services/content/**', 'contracts/**']
            tasks: ['services/tasks/**', 'contracts/**']
            solutions: ['services/solutions/**', 'contracts/**']
            execution: ['services/execution/**', 'contracts/**']
            ai: ['services/ai/**', 'contracts/**']
            support: ['services/support/**', 'services/bots/support-bot/**', 'contracts/**']
            minecraft: ['services/minecraft/**', 'plugins/minecraft/**', 'contracts/**']
            files: ['services/files/**', 'contracts/**']
            notifications: ['services/notifications/**', 'contracts/**']
            observability: ['services/observability/**', 'contracts/**']
            analyzers: ['services/analyzers/**']
            bots: ['services/bots/**']
            infra: ['infrastructure/**', 'deploy/**', '.github/workflows/develop-build.yml']
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          all='${{ github.event.inputs.build_all }}'
          items=()
          add() { items+=("{\"name\":\"$1\",\"context\":\"$2\",\"dockerfile\":\"$3\"}"); }
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.gateway }}" = "true" ]; then add gateway ./apps/gateway Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.front }}" = "true" ]; then add front ./apps/web Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.front_ct }}" = "true" ]; then add front-ct ./apps/web-ct Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.identity }}" = "true" ]; then add identity-api . services/identity/api/Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.education }}" = "true" ]; then add education-api . services/education/api/Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.content }}" = "true" ]; then add content-api ./services/content/api Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.tasks }}" = "true" ]; then add tasks-api . services/tasks/assignment-api/Dockerfile; add quiz-api ./services/tasks/quiz-api Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.solutions }}" = "true" ]; then add solutions-api . services/solutions/api/Dockerfile; add rating-worker . services/solutions/rating-worker/Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.execution }}" = "true" ]; then add execution-api . services/execution/api/Dockerfile; add execution-worker . services/execution/worker/Dockerfile; add csharp-runner ./services/execution/runners/csharp-runner Dockerfile; add cpp-runner ./services/execution/runners/cpp-runner Dockerfile; add java-runner ./services/execution/runners/java-runner Dockerfile; add javascript-runner ./services/execution/runners/javascript-runner Dockerfile; add pascal-runner ./services/execution/runners/pascal-runner Dockerfile; add image-cpp-runner ./services/execution/runners/image-cpp-runner Dockerfile; add image-pascal-runner ./services/execution/runners/image-pascal-runner Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.ai }}" = "true" ]; then add ai-api . services/ai/api/Dockerfile; add ai-worker ./services/ai/worker Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.support }}" = "true" ]; then add support-api . services/support/api/Dockerfile; add support-bot . services/bots/support-bot/Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.minecraft }}" = "true" ]; then add minecraft-api . services/minecraft/api/Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.files }}" = "true" ]; then add files-api . services/files/api/Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.notifications }}" = "true" ]; then add notifications-api . services/notifications/api/Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.observability }}" = "true" ]; then add observability-api . services/observability/api/Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.analyzers }}" = "true" ]; then add code-analyzer ./services/analyzers/code-analyzer Dockerfile; add image-analyzer ./services/analyzers/image-analyzer Dockerfile; fi
          if [ "$all" = "true" ] || [ "${{ steps.filter.outputs.bots }}" = "true" ]; then add telegram-quiz-bot ./services/bots/telegram-quiz-bot Dockerfile; fi
          if [ ${#items[@]} -eq 0 ]; then echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"; else printf -v joined ',%s' "${items[@]}"; echo "matrix={\"include\":[${joined:1}]}" >> "$GITHUB_OUTPUT"; fi

  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/dev/.env.example deploy/dev/.env
      - run: ./deploy/dev/compose.sh config
      - run: cp deploy/prod/.env.example deploy/prod/.env
      - run: ./deploy/prod/compose.sh config

  build:
    needs: [changes, compose-check]
    if: ${{ needs.changes.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare lowercase GHCR image prefix
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          echo "prefix=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.prefix }}/${{ matrix.name }}:${{ github.sha }}
            ${{ steps.image.outputs.prefix }}/${{ matrix.name }}:develop
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
