name: docker images

# Current policy: TaskForge is still in development, so GHCR images are built with
# verbose TaskForge diagnostics enabled. Do not change this to "0" unless the user
# explicitly asks to build quiet images. Normal CI never turns a workflow-file
# change into an implicit full rebuild; use the dedicated full-rebuild workflow.
env:
  TASKFORGE_BUILD_DEBUG_LOGS: "1"
  # Public by request: let browser DevTools resolve the original React sources.
  TASKFORGE_PUBLIC_SOURCEMAPS: "1"
  # BuildKit GHA cache can occasionally leave a manifest pointing to an expired/missing blob.
  # Bump this value (v3, v4, ...) to force all Docker builds to ignore the old broken cache.
  TF_DOCKER_GHA_CACHE_VERSION: "v2"

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      debug_logs:
        description: Build images with TaskForge development diagnostics. Keep 1 while the project is in development; use 0 only when explicitly requested.
        type: choice
        options:
          - "1"
          - "0"
        default: "1"
      build_all:
        description: Explicitly build all project images. Prefer the dedicated full-rebuild workflow for this.
        type: boolean
        default: false
      images:
        description: Optional comma-separated image names to build, for example identity-api,front,ai-worker
        type: string
        required: false
        default: ""
      no_cache:
        description: Ignore Docker layer cache for this manual run. Use when GitHub cache returns missing blob / BlobNotFound.
        type: boolean
        default: false

concurrency:
  group: taskforge-docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      sql_contract: ${{ steps.matrix.outputs.sql_contract }}
      sql_engines: ${{ steps.matrix.outputs.sql_engines }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          build_all="${{ github.event.inputs.build_all || 'false' }}"
          force_build_all="false"
          requested_images="${{ github.event.inputs.images || '' }}"
          debug_logs="${{ github.event.inputs.debug_logs || env.TASKFORGE_BUILD_DEBUG_LOGS }}"
          echo "Workflow build switch: TASKFORGE_DEBUG_LOGS=${debug_logs}"

          # name|docker build context|dockerfile relative to context|paths that affect this image
          # Keep paths as tight as possible: changing one microservice rebuilds only that image.
          images=(
            "gateway|./apps/gateway|Dockerfile|apps/gateway/"
            "front|./apps/web|Dockerfile|apps/web/"
            "front-ct|./apps/web-ct|Dockerfile|apps/web-ct/"
            "postgres-ha|.|infrastructure/postgres-ha/Dockerfile|infrastructure/postgres-ha/"

            "identity-api|.|services/identity/api/Dockerfile|services/identity/api/ Directory.Build.props global.json .dockerignore"
            "education-api|.|services/education/api/Dockerfile|services/education/api/ Directory.Build.props global.json .dockerignore"
            "content-api|./services/content/api|Dockerfile|services/content/api/"
            "tasks-api|.|services/tasks/assignment-api/Dockerfile|services/tasks/assignment-api/ services/shared/Sql/ Directory.Build.props global.json .dockerignore"
            "quiz-api|./services/tasks/quiz-api|Dockerfile|services/tasks/quiz-api/"
            "solutions-api|.|services/solutions/api/Dockerfile|services/solutions/api/ services/shared/Sql/ Directory.Build.props global.json .dockerignore"
            "rating-worker|.|services/solutions/rating-worker/Dockerfile|services/solutions/rating-worker/ Directory.Build.props global.json .dockerignore"

            "execution-api|.|services/execution/api/Dockerfile|services/execution/api/ services/shared/Sql/ Directory.Build.props global.json .dockerignore"
            "execution-worker|.|services/execution/worker/Dockerfile|services/execution/worker/ Directory.Build.props global.json .dockerignore"
            "sql-worker|./services/execution/sql-worker|Dockerfile|services/execution/sql-worker/"
            "csharp-runner|./services/execution/runners/csharp-runner|Dockerfile|services/execution/runners/csharp-runner/"
            "cpp-runner|./services/execution/runners/cpp-runner|Dockerfile|services/execution/runners/cpp-runner/"
            "java-runner|./services/execution/runners/java-runner|Dockerfile|services/execution/runners/java-runner/"
            "javascript-runner|./services/execution/runners/javascript-runner|Dockerfile|services/execution/runners/javascript-runner/"
            "pascal-runner|./services/execution/runners/pascal-runner|Dockerfile|services/execution/runners/pascal-runner/"
            "python-runner|./services/execution/runners/python-runner|Dockerfile|services/execution/runners/python-runner/"
            "image-cpp-runner|./services/execution/runners/image-cpp-runner|Dockerfile|services/execution/runners/image-cpp-runner/"
            "image-pascal-runner|./services/execution/runners/image-pascal-runner|Dockerfile|services/execution/runners/image-pascal-runner/"
            "image-python-runner|./services/execution/runners/image-python-runner|Dockerfile|services/execution/runners/image-python-runner/"

            "ai-api|.|services/ai/api/Dockerfile|services/ai/api/ Directory.Build.props global.json .dockerignore"
            "ai-worker|./services/ai/worker|Dockerfile|services/ai/worker/"
            "code-analyzer|./services/analyzers/code-analyzer|Dockerfile|services/analyzers/code-analyzer/"
            "image-analyzer|./services/analyzers/image-analyzer|Dockerfile|services/analyzers/image-analyzer/"

            "support-api|.|services/support/api/Dockerfile|services/support/api/ Directory.Build.props global.json .dockerignore"
            "support-bot|.|services/bots/support-bot/Dockerfile|services/bots/support-bot/ Directory.Build.props global.json .dockerignore"
            "minecraft-api|.|services/minecraft/api/Dockerfile|services/minecraft/api/ Directory.Build.props global.json .dockerignore"
            "files-api|.|services/files/api/Dockerfile|services/files/api/ Directory.Build.props global.json .dockerignore"
            "notifications-api|.|services/notifications/api/Dockerfile|services/notifications/api/ Directory.Build.props global.json .dockerignore"
            "observability-api|.|services/observability/api/Dockerfile|services/observability/api/ Directory.Build.props global.json .dockerignore"
            "browser-api|.|services/browser/api/Dockerfile|services/browser/api/ Directory.Build.props global.json .dockerignore"
            "telegram-quiz-bot|./services/bots/telegram-quiz-bot|Dockerfile|services/bots/telegram-quiz-bot/"
          )

          changed_files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # A PR diff already includes every commit in the PR, so a failed earlier PR run
            # cannot make image-affecting changes disappear from the next run.
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [[ "$GITHUB_REF" == refs/heads/* ]]; then
              # IMPORTANT: do not diff only github.event.before..HEAD here. If a workflow
              # fails before Docker builds (compile/security/compose/etc.), the next fix
              # commit would otherwise forget image changes from the failed push.
              #
              # The last successful automatic docker-images run is the deployment/build
              # baseline. Everything since that SHA remains pending until a full workflow
              # succeeds. This also handles cancelled runs and Docker build failures.
              baseline_sha="$(
                gh api \
                  -H 'Accept: application/vnd.github+json' \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  "/repos/${GITHUB_REPOSITORY}/actions/workflows/develop-build.yml/runs?branch=${GITHUB_REF_NAME}&event=push&status=success&per_page=1" \
                  --jq '.workflow_runs[0].head_sha // empty' 2>/dev/null || true
              )"

              if [ -n "$baseline_sha" ] \
                && git cat-file -e "${baseline_sha}^{commit}" 2>/dev/null \
                && git merge-base --is-ancestor "$baseline_sha" "${{ github.sha }}"; then
                echo "Last successful docker-images baseline: $baseline_sha"
                changed_files="$(git diff --name-only "$baseline_sha" "${{ github.sha }}")"
              else
                echo "No usable successful docker-images baseline found; falling back to this push diff only."
                before="${{ github.event.before }}"
                if [ -n "$before" ] \
                  && [ "$before" != "0000000000000000000000000000000000000000" ] \
                  && git cat-file -e "${before}^{commit}" 2>/dev/null; then
                  changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
                else
                  changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
                fi
              fi
            else
              # Release tags must represent a complete image set, not only files touched by
              # the commit immediately before the tag.
              echo "Tag push detected; forcing a full rebuild."
              force_build_all="true"
              changed_files="$(git ls-files)"
            fi
          fi

          # Current-event changes are the primary input for expensive tests. Docker
          # image selection may use a cumulative last-success baseline; later we reuse
          # that baseline only through the narrow SQL classifier so an unresolved SQL
          # change stays fenced without making unrelated pending changes start SQL.
          test_changed_files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test_changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [[ "$GITHUB_REF" == refs/heads/* ]]; then
              before="${{ github.event.before }}"
              if [ -n "$before" ] \
                && [ "$before" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "${before}^{commit}" 2>/dev/null; then
                test_changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
              else
                test_changed_files="$(git diff-tree --no-commit-id --name-only -r "${{ github.sha }}")"
              fi
            else
              test_changed_files="$(git ls-files)"
            fi
          fi

          echo "Build-impact files:"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files"
          else
            echo "  <none>"
          fi
          echo "Current-event files used for expensive test selection:"
          if [ -n "$test_changed_files" ]; then
            printf '%s\n' "$test_changed_files"
          else
            echo "  <none>"
          fi

          # Default policy: build only images touched by the diff.
          # Infrastructure, docs and deploy-script changes do not rebuild every service.
          # Workflow-file changes are build-affecting because TASKFORGE_DEBUG_LOGS is baked into images.

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            build_all="false"
          fi

          if [ "$force_build_all" = "true" ]; then
            build_all="true"
          fi

          is_requested() {
            local name="$1"
            [ -n "$requested_images" ] || return 1
            local normalized=",${requested_images// /},"
            [[ "$normalized" == *",$name,"* ]]
          }

          path_changed() {
            local path
            for path in "$@"; do
              [ -n "$path" ] || continue
              while IFS= read -r changed; do
                [ -n "$changed" ] || continue
                if [[ "$changed" == "$path"* ]] || [[ "$changed" == "$path" ]]; then
                  return 0
                fi
              done <<< "$changed_files"
            done
            return 1
          }

          if [ "${{ github.event_name }}" = "push" ] && path_changed ".github/workflows/develop-build.yml"; then
            echo "Workflow file changed; normal CI will NOT rebuild every image automatically."
            echo "If image-wide build args changed, run the dedicated docker images full rebuild workflow explicitly."
          fi

          current_sql_contract="$(printf '%s\n' "$test_changed_files" | python3 ./scripts/ci/sql-change-impact.py --field contract)"
          current_sql_engines="$(printf '%s\n' "$test_changed_files" | python3 ./scripts/ci/sql-change-impact.py --field engines)"
          pending_sql_contract="$(printf '%s\n' "$changed_files" | python3 ./scripts/ci/sql-change-impact.py --field contract)"
          pending_sql_engines="$(printf '%s\n' "$changed_files" | python3 ./scripts/ci/sql-change-impact.py --field engines)"

          sql_contract="false"
          sql_engines="false"
          if [ "$current_sql_contract" = "true" ] || [ "$pending_sql_contract" = "true" ]; then
            sql_contract="true"
          fi
          if [ "$current_sql_engines" = "true" ] || [ "$pending_sql_engines" = "true" ]; then
            sql_engines="true"
          fi

          # The cumulative check above is SQL-specific only. It keeps a failed SQL
          # change fenced until a successful workflow without making generic pending
          # frontend/API changes start database containers.

          # Full/tag validation is intentionally exhaustive. A manual sql-worker
          # rebuild validates the provider runtime even without a source diff.
          if [ "$build_all" = "true" ]; then
            sql_contract="true"
            sql_engines="true"
          elif is_requested "sql-worker"; then
            sql_engines="true"
          fi

          echo "sql_contract=$sql_contract" >> "$GITHUB_OUTPUT"
          echo "sql_engines=$sql_engines" >> "$GITHUB_OUTPUT"
          echo "SQL contract gate selected: $sql_contract"
          echo "SQL real-engine gate selected: $sql_engines"
          echo "Current-event SQL impact:"
          printf '%s\n' "$test_changed_files" | python3 ./scripts/ci/sql-change-impact.py --explain
          echo "Pending SQL impact since last successful image workflow:"
          printf '%s\n' "$changed_files" | python3 ./scripts/ci/sql-change-impact.py --explain

          items=()
          add() {
            items+=("{\"name\":\"$1\",\"context\":\"$2\",\"dockerfile\":\"$3\"}")
          }

          for spec in "${images[@]}"; do
            IFS='|' read -r name context dockerfile paths <<< "$spec"
            read -r -a path_array <<< "$paths"

            if [ "$build_all" = "true" ] || is_requested "$name" || path_changed "${path_array[@]}"; then
              add "$name" "$context" "$dockerfile"
            fi
          done

          if [ ${#items[@]} -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo "No image changes detected. Docker build matrix is empty."
          else
            printf -v joined ',%s' "${items[@]}"
            echo "matrix={\"include\":[${joined:1}]}" >> "$GITHUB_OUTPUT"
            echo "count=${#items[@]}" >> "$GITHUB_OUTPUT"
            echo "Selected ${#items[@]} image(s):"
            printf '  %s\n' "${items[@]}"
          fi

  workflow-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check repository and release boundaries
        run: bash scripts/tests/repository.sh

  dotnet-behavior-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build all production .NET projects and run behavior tests
        run: bash scripts/tests/dotnet.sh

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Run frontend behavior tests and production build
        run: bash scripts/tests/frontend.sh

  minecraft-link-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check unlimited Minecraft links and shared balance
        run: bash scripts/ci/check-minecraft-link-invariants.sh

  oj-security-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.x'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install security check dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Check OJ security invariants
        run: bash scripts/security/check-oj-security.sh
      - name: Check C# runner policy regressions
        run: dotnet run --project tools/csharp-runner-policy-check/TaskForge.CSharpRunner.PolicyCheck.csproj -c Release

  browser-security-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Install Browser API security check dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Check Browser API security invariants
        run: bash scripts/security/check-browser-api-security.sh

      - name: Compile Browser API before Docker build
        run: bash scripts/ci/check-browser-api-build.sh

  sql-runtime-check:
    needs: changes
    if: ${{ needs.changes.outputs.sql_contract == 'true' || needs.changes.outputs.sql_engines == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python3 -m pip install PyYAML==6.0.2
      - name: SQL structural and immutable-boundary checks
        run: python3 ./scripts/ci/check-sql-runtime.py

      - uses: actions/setup-dotnet@v5
        if: ${{ needs.changes.outputs.sql_contract == 'true' }}
        with:
          dotnet-version: '10.0.x'
      - name: SQL domain and wire-contract checks
        if: ${{ needs.changes.outputs.sql_contract == 'true' }}
        run: bash ./scripts/check-sql-domain.sh

      - uses: actions/setup-go@v6
        if: ${{ needs.changes.outputs.sql_engines == 'true' }}
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: services/execution/sql-worker/go.mod
      - name: Install native SQL client build dependencies
        if: ${{ needs.changes.outputs.sql_engines == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libpq-dev libmariadb-dev libsqlite3-dev
      - name: Go/SQLite SQL worker checks
        if: ${{ needs.changes.outputs.sql_engines == 'true' }}
        run: bash ./scripts/check-sql-go.sh
      - name: Real PostgreSQL/MySQL/RabbitMQ interoperability
        if: ${{ needs.changes.outputs.sql_engines == 'true' }}
        run: bash ./scripts/sql/test-engines.sh

  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Compose configuration
        run: bash scripts/tests/compose.sh

  build:
    needs: [changes, compose-check, workflow-integrity, dotnet-behavior-tests, frontend-tests, minecraft-link-invariants, oj-security-invariants, browser-security-invariants, sql-runtime-check]
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.compose-check.result == 'success' &&
        needs.workflow-integrity.result == 'success' &&
        needs.dotnet-behavior-tests.result == 'success' &&
        needs.frontend-tests.result == 'success' &&
        needs.minecraft-link-invariants.result == 'success' &&
        needs.oj-security-invariants.result == 'success' &&
        needs.browser-security-invariants.result == 'success' &&
        (needs.sql-runtime-check.result == 'success' || needs.sql-runtime-check.result == 'skipped') &&
        needs.changes.outputs.matrix != '{"include":[]}'
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare lowercase GHCR image prefix
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          echo "prefix=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.prefix }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build ${{ matrix.name }} without importing cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TASKFORGE_DEBUG_LOGS=${{ github.event.inputs.debug_logs || env.TASKFORGE_BUILD_DEBUG_LOGS }}
            TASKFORGE_PUBLIC_SOURCEMAPS=${{ env.TASKFORGE_PUBLIC_SOURCEMAPS }}
          no-cache: true
          cache-to: type=gha,mode=max,scope=${{ env.TF_DOCKER_GHA_CACHE_VERSION }}-${{ matrix.name }},ignore-error=true

      - name: Build ${{ matrix.name }} with cache
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.no_cache }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TASKFORGE_DEBUG_LOGS=${{ github.event.inputs.debug_logs || env.TASKFORGE_BUILD_DEBUG_LOGS }}
            TASKFORGE_PUBLIC_SOURCEMAPS=${{ env.TASKFORGE_PUBLIC_SOURCEMAPS }}
          cache-from: type=gha,scope=${{ env.TF_DOCKER_GHA_CACHE_VERSION }}-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ env.TF_DOCKER_GHA_CACHE_VERSION }}-${{ matrix.name }},ignore-error=true
