name: docker images

# Current policy: TaskForge is still in development, so GHCR images are built with
# verbose TaskForge diagnostics enabled. Do not change this to "0" unless the user
# explicitly asks to build quiet images. A workflow change forces a full rebuild.
env:
  TASKFORGE_BUILD_DEBUG_LOGS: "1"
  # BuildKit GHA cache can occasionally leave a manifest pointing to an expired/missing blob.
  # Bump this value (v3, v4, ...) to force all Docker builds to ignore the old broken cache.
  TF_DOCKER_GHA_CACHE_VERSION: "v2"

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      debug_logs:
        description: Build images with TaskForge development diagnostics. Keep 1 while the project is in development; use 0 only when explicitly requested.
        type: choice
        options:
          - "1"
          - "0"
        default: "1"
      build_all:
        description: Build all project images. Leave enabled when changing the debug-log switch.
        type: boolean
        default: true
      images:
        description: Optional comma-separated image names to build, for example identity-api,front,ai-worker
        type: string
        required: false
        default: ""
      no_cache:
        description: Ignore Docker layer cache for this manual run. Use when GitHub cache returns missing blob / BlobNotFound.
        type: boolean
        default: false

concurrency:
  group: taskforge-docker-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: matrix
        shell: bash
        run: |
          set -euo pipefail

          build_all="${{ github.event.inputs.build_all || 'false' }}"
          requested_images="${{ github.event.inputs.images || '' }}"
          debug_logs="${{ github.event.inputs.debug_logs || env.TASKFORGE_BUILD_DEBUG_LOGS }}"
          echo "Workflow build switch: TASKFORGE_DEBUG_LOGS=${debug_logs}"

          # name|docker build context|dockerfile relative to context|paths that affect this image
          # Keep paths as tight as possible: changing one microservice rebuilds only that image.
          images=(
            "gateway|./apps/gateway|Dockerfile|apps/gateway/"
            "front|./apps/web|Dockerfile|apps/web/"
            "front-ct|./apps/web-ct|Dockerfile|apps/web-ct/"

            "identity-api|.|services/identity/api/Dockerfile|services/identity/api/ Directory.Build.props global.json .dockerignore"
            "education-api|.|services/education/api/Dockerfile|services/education/api/ Directory.Build.props global.json .dockerignore"
            "content-api|./services/content/api|Dockerfile|services/content/api/"
            "tasks-api|.|services/tasks/assignment-api/Dockerfile|services/tasks/assignment-api/ Directory.Build.props global.json .dockerignore"
            "quiz-api|./services/tasks/quiz-api|Dockerfile|services/tasks/quiz-api/"
            "solutions-api|.|services/solutions/api/Dockerfile|services/solutions/api/ Directory.Build.props global.json .dockerignore"
            "rating-worker|.|services/solutions/rating-worker/Dockerfile|services/solutions/rating-worker/ Directory.Build.props global.json .dockerignore"

            "execution-api|.|services/execution/api/Dockerfile|services/execution/api/ Directory.Build.props global.json .dockerignore"
            "execution-worker|.|services/execution/worker/Dockerfile|services/execution/worker/ Directory.Build.props global.json .dockerignore"
            "csharp-runner|./services/execution/runners/csharp-runner|Dockerfile|services/execution/runners/csharp-runner/"
            "cpp-runner|./services/execution/runners/cpp-runner|Dockerfile|services/execution/runners/cpp-runner/"
            "java-runner|./services/execution/runners/java-runner|Dockerfile|services/execution/runners/java-runner/"
            "javascript-runner|./services/execution/runners/javascript-runner|Dockerfile|services/execution/runners/javascript-runner/"
            "pascal-runner|./services/execution/runners/pascal-runner|Dockerfile|services/execution/runners/pascal-runner/"
            "python-runner|./services/execution/runners/python-runner|Dockerfile|services/execution/runners/python-runner/"
            "image-cpp-runner|./services/execution/runners/image-cpp-runner|Dockerfile|services/execution/runners/image-cpp-runner/"
            "image-pascal-runner|./services/execution/runners/image-pascal-runner|Dockerfile|services/execution/runners/image-pascal-runner/"
            "image-python-runner|./services/execution/runners/image-python-runner|Dockerfile|services/execution/runners/image-python-runner/"

            "ai-api|.|services/ai/api/Dockerfile|services/ai/api/ Directory.Build.props global.json .dockerignore"
            "ai-worker|./services/ai/worker|Dockerfile|services/ai/worker/"
            "code-analyzer|./services/analyzers/code-analyzer|Dockerfile|services/analyzers/code-analyzer/"
            "image-analyzer|./services/analyzers/image-analyzer|Dockerfile|services/analyzers/image-analyzer/"

            "support-api|.|services/support/api/Dockerfile|services/support/api/ Directory.Build.props global.json .dockerignore"
            "support-bot|.|services/bots/support-bot/Dockerfile|services/bots/support-bot/ Directory.Build.props global.json .dockerignore"
            "minecraft-api|.|services/minecraft/api/Dockerfile|services/minecraft/api/ Directory.Build.props global.json .dockerignore"
            "files-api|.|services/files/api/Dockerfile|services/files/api/ Directory.Build.props global.json .dockerignore"
            "notifications-api|.|services/notifications/api/Dockerfile|services/notifications/api/ Directory.Build.props global.json .dockerignore"
            "observability-api|.|services/observability/api/Dockerfile|services/observability/api/ Directory.Build.props global.json .dockerignore"
            "telegram-quiz-bot|./services/bots/telegram-quiz-bot|Dockerfile|services/bots/telegram-quiz-bot/"
          )

          changed_files=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")"
          elif [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              changed_files="$(git diff --name-only HEAD~1 HEAD || git ls-files)"
            else
              changed_files="$(git diff --name-only "$before" "${{ github.sha }}")"
            fi
          fi

          echo "Changed files:"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files"
          else
            echo "  <none>"
          fi

          # Default policy: build only images touched by the diff.
          # Infrastructure, docs and deploy-script changes do not rebuild every service.
          # Workflow-file changes are build-affecting because TASKFORGE_DEBUG_LOGS is baked into images.

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            build_all="false"
          fi

          is_requested() {
            local name="$1"
            [ -n "$requested_images" ] || return 1
            local normalized=",${requested_images// /},"
            [[ "$normalized" == *",$name,"* ]]
          }

          path_changed() {
            local path
            for path in "$@"; do
              [ -n "$path" ] || continue
              while IFS= read -r changed; do
                [ -n "$changed" ] || continue
                if [[ "$changed" == "$path"* ]] || [[ "$changed" == "$path" ]]; then
                  return 0
                fi
              done <<< "$changed_files"
            done
            return 1
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -z "$requested_images" ]; then
            # Debug logging is baked into images. Manual workflow runs rebuild all by default
            # so flipping debug_logs=1/0 actually changes every image.
            build_all="true"
          fi

          if [ "${{ github.event_name }}" = "push" ] && path_changed ".github/workflows/develop-build.yml"; then
            echo "Workflow file changed; forcing full rebuild because image build args may have changed."
            build_all="true"
          fi

          items=()
          add() {
            items+=("{\"name\":\"$1\",\"context\":\"$2\",\"dockerfile\":\"$3\"}")
          }

          for spec in "${images[@]}"; do
            IFS='|' read -r name context dockerfile paths <<< "$spec"
            read -r -a path_array <<< "$paths"

            if [ "$build_all" = "true" ] || is_requested "$name" || path_changed "${path_array[@]}"; then
              add "$name" "$context" "$dockerfile"
            fi
          done

          if [ ${#items[@]} -eq 0 ]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            echo "No image changes detected. Docker build matrix is empty."
          else
            printf -v joined ',%s' "${items[@]}"
            echo "matrix={\"include\":[${joined:1}]}" >> "$GITHUB_OUTPUT"
            echo "count=${#items[@]}" >> "$GITHUB_OUTPUT"
            echo "Selected ${#items[@]} image(s):"
            printf '  %s\n' "${items[@]}"
          fi

  workflow-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Docker workflow integrity
        run: python3 scripts/ci/check-workflow-integrity.py

  minecraft-link-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check unlimited Minecraft links and shared balance
        run: bash scripts/ci/check-minecraft-link-invariants.sh

  oj-security-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Install security check dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Check OJ security invariants
        run: bash scripts/security/check-oj-security.sh

  compose-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp deploy/dev/.env.example deploy/dev/.env
      - run: bash ./deploy/dev/compose.sh config
      - run: cp deploy/prod/.env.example deploy/prod/.env
      - run: bash ./deploy/prod/compose.sh config

  build:
    needs: [changes, compose-check, workflow-integrity, minecraft-link-invariants, oj-security-invariants]
    if: ${{ needs.changes.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare lowercase GHCR image prefix
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          echo "prefix=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.prefix }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build ${{ matrix.name }} without importing cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TASKFORGE_DEBUG_LOGS=${{ github.event.inputs.debug_logs || env.TASKFORGE_BUILD_DEBUG_LOGS }}
          no-cache: true
          cache-to: type=gha,mode=max,scope=${{ env.TF_DOCKER_GHA_CACHE_VERSION }}-${{ matrix.name }},ignore-error=true

      - name: Build ${{ matrix.name }} with cache
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.no_cache }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TASKFORGE_DEBUG_LOGS=${{ github.event.inputs.debug_logs || env.TASKFORGE_BUILD_DEBUG_LOGS }}
          cache-from: type=gha,scope=${{ env.TF_DOCKER_GHA_CACHE_VERSION }}-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ env.TF_DOCKER_GHA_CACHE_VERSION }}-${{ matrix.name }},ignore-error=true
