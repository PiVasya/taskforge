name: Build & Push Telegram Quiz Bot

on:
  push:
    paths:
      - "telegram-quiz-bot/**"
      - "compose/**"
      - "docker-compose-develop.yaml"
      - "docker-compose-develop-split.yaml"
      - ".github/workflows/build-telegram-quiz-bot.yml"
  pull_request:
    paths:
      - "telegram-quiz-bot/**"
      - "compose/**"
      - "docker-compose-develop.yaml"
      - "docker-compose-develop-split.yaml"
      - ".github/workflows/build-telegram-quiz-bot.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ github.event_name == 'push' && contains(fromJson('["refs/heads/develop","refs/heads/main","refs/heads/master"]'), github.ref) }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./telegram-quiz-bot
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && contains(fromJson('["refs/heads/develop","refs/heads/main","refs/heads/master"]'), github.ref) }}
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/taskforge-telegram-quiz-bot:latest
            ghcr.io/${{ env.OWNER_LC }}/taskforge-telegram-quiz-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
