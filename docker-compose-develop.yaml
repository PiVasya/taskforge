services:
  db:
    image: postgres:17
    container_name: taskforge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Warsaw
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    image: minio/minio:latest
    container_name: taskforge-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Europe/Warsaw
    volumes:
      - minio-data:/data
    networks: [appnet]
    ports:
      - "9001:9001"
      - "127.0.0.1:9000:9000"

  minio-init:
    image: minio/mc:latest
    container_name: taskforge-minio-init
    profiles: ["init"]
    depends_on:
      - minio
    networks: [appnet]
    environment:
      MINIO_INTERNAL_ENDPOINT: "http://minio:9000"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: >
      /bin/sh -c '
      set -eu;

      until mc alias set local "$MINIO_INTERNAL_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; do
        echo "waiting for minio..."; sleep 2;
      done;

      mc mb -p "local/$S3_BUCKET" || true;

      mc admin user remove local "$S3_ACCESS_KEY" || true;
      mc admin user add local "$S3_ACCESS_KEY" "$S3_SECRET_KEY";

      mc admin policy attach local readwrite --user "$S3_ACCESS_KEY" || true;

      echo "minio init done";
      '
    restart: "no"

  image-analyzer:
    image: ghcr.io/pivasya/taskforge-image-analyzer:latest
    container_name: taskforge-image-analyzer
    environment:
      TZ: Europe/Warsaw
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  code-analyzer:
    image: ghcr.io/pivasya/taskforge-code-analyzer:latest
    container_name: taskforge-code-analyzer
    environment:
      TZ: Europe/Warsaw
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  api:
    image: ghcr.io/pivasya/taskforge-api:latest
    container_name: taskforge-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production

      ConnectionStrings__DefaultConnection: >
        Host=db;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

      API_INTERNAL_KEY: ${API_INTERNAL_KEY}

      # Новый internal key именно для Agent worker.
      # InternalAgentController читает TASKFORGE_AGENT_INTERNAL_KEY,
      # Agent:InternalKey и API_INTERNAL_KEY как fallback.
      TASKFORGE_AGENT_INTERNAL_KEY: ${TASKFORGE_AGENT_INTERNAL_KEY}
      Agent__InternalKey: ${TASKFORGE_AGENT_INTERNAL_KEY}

      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpireMinutes: ${JWT_EXPIRE_MINUTES}

      S3__Endpoint: "http://minio:9000"
      S3__Bucket: ${S3_BUCKET}
      S3__AccessKey: ${S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY}
      S3__Region: ${S3_REGION}
      S3__UsePathStyle: ${S3_USE_PATH_STYLE}

      Compilers__cpp__Url: "http://cpp-runner:8080"
      Compilers__cpp__TimeoutMs: "12000"
      Compilers__csharp__Url: "http://csharp-runner:8080"
      Compilers__csharp__TimeoutMs: "12000"
      Compilers__python__Url: "http://python-runner:8080"
      Compilers__python__TimeoutMs: "8000"
      Compilers__pascal__Url: "http://pascal-runner:8080"
      Compilers__pascal__TimeoutMs: "8000"
      Compilers__java__Url: "http://java-runner:8080"
      Compilers__java__TimeoutMs: "12000"
      Compilers__javascript__Url: "http://javascript-runner:8080"
      Compilers__javascript__TimeoutMs: "8000"

      ImageRunners__python__Url: "http://image-python-runner:8080"
      ImageRunners__python__TimeoutMs: "12000"
      ImageRunners__pascal__Url: "http://image-pascal-runner:8080"
      ImageRunners__pascal__TimeoutMs: "12000"
      ImageRunners__cpp__Url: "http://image-cpp-runner:8080"
      ImageRunners__cpp__TimeoutMs: "15000"

      ImageAnalyzer__Enabled: "true"
      ImageAnalyzer__Url: "http://image-analyzer:8080"
      ImageAnalyzer__TimeoutSeconds: "25"

      CodeAnalyzer__Enabled: "true"
      CodeAnalyzer__Url: "http://code-analyzer:8080"
      CodeAnalyzer__TimeoutSeconds: "6"

      MINECRAFT_WEBHOOK_BASE_URL: ${MINECRAFT_WEBHOOK_BASE_URL}
      MINECRAFT_WEBHOOK_SEND_CODE_PATH: ${MINECRAFT_WEBHOOK_SEND_CODE_PATH}
      MINECRAFT_WEBHOOK_KEY: ${MINECRAFT_WEBHOOK_KEY}
      MINECRAFT_WEEKLY_PENALTY: ${MINECRAFT_WEEKLY_PENALTY}
      MINECRAFT_PLUGIN_KEY: ${MINECRAFT_PLUGIN_KEY}

    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      cpp-runner:
        condition: service_started
      csharp-runner:
        condition: service_started
      python-runner:
        condition: service_started
      pascal-runner:
        condition: service_started
      java-runner:
        condition: service_started
      javascript-runner:
        condition: service_started
      image-python-runner:
        condition: service_started
      image-pascal-runner:
        condition: service_started
      image-cpp-runner:
        condition: service_started
      image-analyzer:
        condition: service_started
      code-analyzer:
        condition: service_started

    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  support-bot:
    image: ghcr.io/pivasya/taskforge-support-bot:latest
    container_name: taskforge-support-bot
    environment:
      ConnectionStrings__DefaultConnection: >
        Host=db;Port=5432;Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}

      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_SUPPORT_GROUP_ID: ${TELEGRAM_SUPPORT_GROUP_ID}

      API_BASE_URL: "http://api:8080"
      API_INTERNAL_KEY: ${API_INTERNAL_KEY}

    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"


  telegram-quiz-db:
    image: postgres:17
    container_name: taskforge-telegram-quiz-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TELEGRAM_QUIZ_POSTGRES_DB}
      POSTGRES_USER: ${TELEGRAM_QUIZ_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TELEGRAM_QUIZ_POSTGRES_PASSWORD}
      TZ: Europe/Warsaw
    volumes:
      - telegram-quiz-pgdata:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TELEGRAM_QUIZ_POSTGRES_USER} -d ${TELEGRAM_QUIZ_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6

  telegram-quiz-bot:
    image: ghcr.io/pivasya/taskforge-telegram-quiz-bot:latest
    container_name: taskforge-telegram-quiz-bot
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__TelegramQuizDb: >
        Host=telegram-quiz-db;Port=5432;Database=${TELEGRAM_QUIZ_POSTGRES_DB};
        Username=${TELEGRAM_QUIZ_POSTGRES_USER};Password=${TELEGRAM_QUIZ_POSTGRES_PASSWORD}

      TelegramQuiz__TeacherBotToken: ${TELEGRAM_QUIZ_TEACHER_BOT_TOKEN}
      TelegramQuiz__StudentBotToken: ${TELEGRAM_QUIZ_STUDENT_BOT_TOKEN}
      TelegramQuiz__TeacherPassword: ${TELEGRAM_QUIZ_TEACHER_PASSWORD}
      TelegramQuiz__ImagePrefix: ${TELEGRAM_QUIZ_IMAGE_PREFIX:-telegram-quiz/images}
      TelegramQuiz__ApplyMigrationsOnStartup: ${TELEGRAM_QUIZ_APPLY_MIGRATIONS_ON_STARTUP:-true}
      TELEGRAM_QUIZ_VERBOSE_CONSOLE_LOGS: ${TELEGRAM_QUIZ_VERBOSE_CONSOLE_LOGS:-true}
      TelegramQuiz__RequestTimeoutSeconds: ${TELEGRAM_QUIZ_REQUEST_TIMEOUT_SECONDS:-600}

      TaskForge__ApiBaseUrl: "http://api:8080"
      TaskForge__InternalKey: ${API_INTERNAL_KEY}

      S3__Endpoint: "http://minio:9000"
      S3__Bucket: ${S3_BUCKET}
      S3__AccessKey: ${S3_ACCESS_KEY}
      S3__SecretKey: ${S3_SECRET_KEY}
      S3__Region: ${S3_REGION}
      S3__UsePathStyle: ${S3_USE_PATH_STYLE}

    depends_on:
      telegram-quiz-db:
        condition: service_healthy
      api:
        condition: service_started
      minio:
        condition: service_started
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5



  telegram-quiz-import:
    image: ghcr.io/pivasya/taskforge-telegram-quiz-bot:latest
    container_name: taskforge-telegram-quiz-import
    profiles: ["telegram-quiz-import"]
    command: ["--import-old-sqlite", "/import"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__TelegramQuizDb: >
        Host=telegram-quiz-db;Port=5432;Database=${TELEGRAM_QUIZ_POSTGRES_DB};
        Username=${TELEGRAM_QUIZ_POSTGRES_USER};Password=${TELEGRAM_QUIZ_POSTGRES_PASSWORD}
      TelegramQuiz__ApplyMigrationsOnStartup: ${TELEGRAM_QUIZ_APPLY_MIGRATIONS_ON_STARTUP:-true}
      TELEGRAM_QUIZ_VERBOSE_CONSOLE_LOGS: ${TELEGRAM_QUIZ_VERBOSE_CONSOLE_LOGS:-true}
    depends_on:
      telegram-quiz-db:
        condition: service_healthy
    volumes:
      - ./imports/telegram-quiz:/import:ro
    networks: [appnet]
    restart: "no"

  front:
    image: ghcr.io/pivasya/taskforge-front:latest
    container_name: taskforge-front
    expose: ["80"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  nginx:
    build:
      context: ./nginx
    container_name: taskforge-nginx
    environment:
      - DOMAIN=${DOMAIN}
    depends_on:
      - front
      - api
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    networks: [appnet]
    restart: unless-stopped

  certbot-init:
    image: certbot/certbot:latest
    container_name: taskforge-certbot-init
    environment:
      - DOMAIN=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL}
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on: [nginx]
    entrypoint:
      - sh
      - -c
      - |
        if [ -f "/etc/letsencrypt/live/$DOMAIN/fullchain.pem" ]; then
          echo "[certbot-init] Certificate already exists for $DOMAIN - skipping";
        else
          certbot certonly \
            --webroot -w /var/www/certbot \
            -d "$DOMAIN" \
            --email "$LETSENCRYPT_EMAIL" \
            --rsa-key-size 4096 --agree-tos --no-eff-email --non-interactive;
        fi
    restart: "no"
    networks: [appnet]

  certbot-renew:
    image: certbot/certbot:latest
    container_name: taskforge-certbot-renew
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on: [nginx]
    entrypoint:
      - sh
      - -c
      - |
        trap : TERM INT
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet
          sleep 12h
        done
    restart: unless-stopped
    networks: [appnet]

  cpp-runner:
    image: ghcr.io/pivasya/taskforge-cpp-runner:latest
    container_name: taskforge-cpp-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  csharp-runner:
    image: ghcr.io/pivasya/taskforge-csharp-runner:latest
    container_name: taskforge-csharp-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  python-runner:
    image: ghcr.io/pivasya/taskforge-python-runner:latest
    container_name: taskforge-python-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  pascal-runner:
    image: ghcr.io/pivasya/taskforge-pascal-runner:latest
    container_name: taskforge-pascal-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  java-runner:
    image: ghcr.io/pivasya/taskforge-java-runner:latest
    container_name: taskforge-java-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  javascript-runner:
    image: ghcr.io/pivasya/taskforge-javascript-runner:latest
    container_name: taskforge-javascript-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  image-python-runner:
    image: ghcr.io/pivasya/taskforge-image-python-runner:latest
    container_name: taskforge-image-python-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  image-pascal-runner:
    image: ghcr.io/pivasya/taskforge-image-pascal-runner:latest
    container_name: taskforge-image-pascal-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  image-cpp-runner:
    image: ghcr.io/pivasya/taskforge-image-cpp-runner:latest
    container_name: taskforge-image-cpp-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  taskforge-ai-worker-external:
    image: ${TASKFORGE_EXTERNAL_AI_IMAGE:-ghcr.io/pivasya/taskforge-ai-worker-external:latest}
    pull_policy: always
    container_name: taskforge-ai-worker-external

    environment:
      TZ: Europe/Warsaw

      # Новый backend agent API.
      TASKFORGE_AGENT_API_BASE_URL: ${TASKFORGE_AGENT_API_BASE_URL:-http://api:8080}
      TASKFORGE_AGENT_INTERNAL_KEY: ${TASKFORGE_AGENT_INTERNAL_KEY}
      TASKFORGE_AGENT_WORKER_ID: ${TASKFORGE_AGENT_WORKER_ID:-taskforge-ai-worker-external}
      TASKFORGE_AGENT_POLL_SECONDS: ${TASKFORGE_AGENT_POLL_SECONDS:-5}
      TASKFORGE_AGENT_HEARTBEAT_SECONDS: ${TASKFORGE_AGENT_HEARTBEAT_SECONDS:-15}
      TASKFORGE_AGENT_REQUEST_TIMEOUT_SECONDS: ${TASKFORGE_AGENT_REQUEST_TIMEOUT_SECONDS:-30}
      TASKFORGE_AGENT_IDLE_LOG_SECONDS: ${TASKFORGE_AGENT_IDLE_LOG_SECONDS:-60}
      TASKFORGE_AGENT_MAX_JOB_SECONDS: ${TASKFORGE_AGENT_MAX_JOB_SECONDS:-900}
      TASKFORGE_AGENT_CONCURRENCY: ${TASKFORGE_AGENT_CONCURRENCY:-3}

      # LLM / OpenRouter.
      TASKFORGE_EXTERNAL_AI_PROVIDER: ${TASKFORGE_EXTERNAL_AI_PROVIDER:-openai_compatible}
      TASKFORGE_EXTERNAL_AI_BASE_URL: ${TASKFORGE_EXTERNAL_AI_BASE_URL:-https://openrouter.ai/api/v1}
      TASKFORGE_EXTERNAL_AI_API_KEY: ${TASKFORGE_EXTERNAL_AI_API_KEY}
      TASKFORGE_EXTERNAL_AI_MODEL: ${TASKFORGE_EXTERNAL_AI_MODEL:-qwen/qwen3.6-plus}
      TASKFORGE_EXTERNAL_AI_TEMPERATURE: ${TASKFORGE_EXTERNAL_AI_TEMPERATURE:-0.12}
      TASKFORGE_EXTERNAL_AI_TOP_P: ${TASKFORGE_EXTERNAL_AI_TOP_P:-0.85}
      TASKFORGE_EXTERNAL_AI_TIMEOUT_SECONDS: ${TASKFORGE_EXTERNAL_AI_TIMEOUT_SECONDS:-180}
      TASKFORGE_EXTERNAL_AI_REQUEST_ATTEMPTS: ${TASKFORGE_EXTERNAL_AI_REQUEST_ATTEMPTS:-5}
      TASKFORGE_EXTERNAL_AI_RETRY_BACKOFF_SECONDS: ${TASKFORGE_EXTERNAL_AI_RETRY_BACKOFF_SECONDS:-12}
      TASKFORGE_EXTERNAL_AI_EXTRA_HEADERS: ${TASKFORGE_EXTERNAL_AI_EXTRA_HEADERS:-}

      # OpenRouter metadata.
      OPENROUTER_APP_URL: ${OPENROUTER_APP_URL:-https://${DOMAIN}}
      OPENROUTER_APP_TITLE: ${OPENROUTER_APP_TITLE:-TaskForge}
      OPENROUTER_CATEGORIES: ${OPENROUTER_CATEGORIES:-education,code-generation}
      OPENROUTER_DATA_COLLECTION: ${OPENROUTER_DATA_COLLECTION:-deny}
      OPENROUTER_ZDR: ${OPENROUTER_ZDR:-false}
      OPENROUTER_REQUIRE_PARAMETERS: ${OPENROUTER_REQUIRE_PARAMETERS:-true}

      # Логи worker-а.
      TASKFORGE_AI_LOG_DIR: /app/logs
      TASKFORGE_AI_LOG_FILE: /app/logs/openrouter-base.log
      TASKFORGE_AI_LOG_INCLUDE_PROMPTS: ${TASKFORGE_AI_LOG_INCLUDE_PROMPTS:-false}
      TASKFORGE_AI_LOG_INCLUDE_RESPONSES: ${TASKFORGE_AI_LOG_INCLUDE_RESPONSES:-false}

    depends_on:
      api:
        condition: service_started

    volumes:
      - ./logs/taskforge-ai-worker-external:/app/logs

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    networks: [appnet]
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: taskforge-watchtower
    command: --interval 60 --cleanup --label-enable --revive-stopped --warn-on-head-failure=auto
    environment:
      - DOCKER_CONFIG=/config
      - WATCHTOWER_NOTIFICATIONS_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/pivasya/Desktop/taskforge-prod-linux/config.json:/config/config.json:ro
    networks: [appnet]
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: taskforge-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8081:80"
    networks: [appnet]

networks:
  appnet:

volumes:
  pgdata:
  telegram-quiz-pgdata:
  minio-data:
  certbot-www:
  letsencrypt:
