services:
  ai-api:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/ai-api:${IMAGE_TAG:-develop}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
      Database__EnsureCreated: ${ENSURE_CREATED:-false}
      Jwt__Key: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-TaskForge}
      Jwt__Audience: ${JWT_AUDIENCE:-TaskForge}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-taskforge}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
      S3__Endpoint: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      S3__PublicEndpoint: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3__AccessKey: ${MINIO_ROOT_USER:-taskforge}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=taskforge_ai;Username=${POSTGRES_USER:-taskforge};Password=${POSTGRES_PASSWORD:?set
        POSTGRES_PASSWORD}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-}
    expose:
    - '8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  ai-worker:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/ai-worker:${IMAGE_TAG:-develop}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      TaskForgeInternalApi__BaseUrl: http://ai-api:8080
      TaskForgeInternalApi__ApiKey: ${TASKFORGE_AGENT_INTERNAL_KEY:-}
      TaskForgeAgent__ApiKey: ${TASKFORGE_EXTERNAL_AI_API_KEY:-}
      TaskForgeAgent__Model: ${TASKFORGE_EXTERNAL_AI_MODEL:-openai/gpt-4o-mini}
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-taskforge}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      OpenAI__Model: ${OPENAI_MODEL:-}
    depends_on:
      ai-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  code-analyzer:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/code-analyzer:${IMAGE_TAG:-develop}
    restart: unless-stopped
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  image-analyzer:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/image-analyzer:${IMAGE_TAG:-develop}
    restart: unless-stopped
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
