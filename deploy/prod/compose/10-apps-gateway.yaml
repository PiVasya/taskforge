services:
  gateway:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/gateway:${IMAGE_TAG:-develop}
    restart: unless-stopped
    environment:
      GATEWAY_MODE: ${GATEWAY_MODE:-auto}
      DOMAIN: ${DOMAIN:?set DOMAIN}
      CT_DOMAIN: ${CT_DOMAIN:?set CT_DOMAIN}
    ports:
    - ${PUBLIC_HTTP_PORT:-80}:80
    - ${PUBLIC_HTTPS_PORT:-443}:443
    volumes:
    - letsencrypt:/etc/letsencrypt
    - certbot-webroot:/var/www/certbot
    depends_on:
      front:
        condition: service_healthy
      front-ct:
        condition: service_healthy
      identity-api:
        condition: service_healthy
      education-api:
        condition: service_healthy
      content-api:
        condition: service_healthy
      quiz-api:
        condition: service_healthy
      tasks-api:
        condition: service_healthy
      solutions-api:
        condition: service_healthy
      execution-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
      support-api:
        condition: service_healthy
      minecraft-api:
        condition: service_healthy
      files-api:
        condition: service_healthy
      notifications-api:
        condition: service_healthy
      observability-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:80/health/gateway || curl -fsS http://127.0.0.1:80/health/gateway >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  front:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/front:${IMAGE_TAG:-develop}
    restart: unless-stopped
    expose:
    - '80'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:80/health || curl -fsS http://127.0.0.1:80/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  front-ct:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/front-ct:${IMAGE_TAG:-develop}
    restart: unless-stopped
    expose:
    - '80'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:80/health || curl -fsS http://127.0.0.1:80/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  letsencrypt: null
  certbot-webroot: null
