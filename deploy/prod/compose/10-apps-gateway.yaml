services:
  gateway:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/gateway:${IMAGE_TAG:-develop}
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-taskforge-prod}
    restart: unless-stopped
    environment:
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
      GATEWAY_AI_TELEMETRY_LOG_RETENTION_SECONDS: ${GATEWAY_AI_TELEMETRY_LOG_RETENTION_SECONDS:-21600}
      BROWSER_EDGE_RATE_RPS: ${BROWSER_EDGE_RATE_RPS:-25}
      BROWSER_API_UPSTREAM: ${BROWSER_API_UPSTREAM:-browser-api:8080}
      GATEWAY_MODE: ${GATEWAY_MODE:-auto}
      TASKFORGE_NODE_ROLE: ${TASKFORGE_NODE_ROLE:-primary}
      TASKFORGE_HA_DYNAMIC_READY: ${TASKFORGE_CLUSTER_ENABLED:-false}
      HA_NODE_ID: ${CLUSTER_NODE_ID:-node}
      DOMAIN: ${DOMAIN:?set DOMAIN}
      CT_DOMAIN: ${CT_DOMAIN:?set CT_DOMAIN}
    ports:
      - ${PUBLIC_HTTP_PORT:-80}:80
      - ${PUBLIC_HTTPS_PORT:-443}:443
    networks:
      default:
        aliases:
          - ${DOMAIN:?set DOMAIN}
          - ${CT_DOMAIN:?set CT_DOMAIN}
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
      - gateway-ai-telemetry:/var/log/taskforge-ai
    depends_on:
      front:
        condition: service_healthy
      front-ct:
        condition: service_healthy
      identity-api:
        condition: service_healthy
      education-api:
        condition: service_healthy
      content-api:
        condition: service_healthy
      quiz-api:
        condition: service_healthy
      tasks-api:
        condition: service_healthy
      solutions-api:
        condition: service_healthy
      execution-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
      support-api:
        condition: service_healthy
      minecraft-api:
        condition: service_healthy
      files-api:
        condition: service_healthy
      notifications-api:
        condition: service_healthy
      observability-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:80/health/gateway || curl -fsS http://127.0.0.1:80/health/gateway >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  front:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/front:${IMAGE_TAG:-develop}
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-taskforge-prod}
    restart: unless-stopped
    expose:
      - '80'
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:80/health || curl -fsS http://127.0.0.1:80/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  front-ct:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/front-ct:${IMAGE_TAG:-develop}
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-taskforge-prod}
    restart: unless-stopped
    expose:
      - '80'
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:80/health || curl -fsS http://127.0.0.1:80/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  letsencrypt:
  certbot-webroot:
  gateway-ai-telemetry:
