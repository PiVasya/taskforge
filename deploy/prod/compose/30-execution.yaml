x-runner-security:
  security_opt: &id001
  - no-new-privileges:true
  cap_drop: &id002
  - ALL
  pids_limit: ${RUNNER_PIDS_LIMIT:-128}
  mem_limit: ${RUNNER_MEM_LIMIT:-512m}
  memswap_limit: ${RUNNER_MEM_LIMIT:-512m}
  cpus: ${RUNNER_CPUS:-1.0}
  read_only: true
  tmpfs: &id003
  - /tmp:size=${RUNNER_TMPFS_SIZE:-256m},mode=1777,exec,nosuid,nodev
services:
  execution-api:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/execution-api:${IMAGE_TAG:-develop}
    labels:
    - com.centurylinklabs.watchtower.enable=true
    - com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-taskforge-prod}
    restart: unless-stopped
    environment:
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
      Database__EnsureCreated: ${ENSURE_CREATED:-false}
      Jwt__Key: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-TaskForge}
      Jwt__Audience: ${JWT_AUDIENCE:-TaskForge}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      RabbitMq__Host: rabbitmq
      InternalApi__Key: ${TASKFORGE_INTERNAL_KEY:?set TASKFORGE_INTERNAL_KEY}
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-taskforge}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
      S3__Endpoint: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      S3__PublicEndpoint: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT}
      S3__AccessKey: ${MINIO_ROOT_USER:-taskforge}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=taskforge_execution;Username=${POSTGRES_USER:-taskforge};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      S3__Bucket: ${S3_BUCKET:-taskforge-files}
      S3__Region: ${S3_REGION:-us-east-1}
      S3__UsePathStyle: ${S3_USE_PATH_STYLE:-true}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD},abortConnect=false
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD},abortConnect=false
      Cache__Enabled: ${CACHE_ENABLED:-true}
      Cache__DefaultTtlSeconds: ${CACHE_DEFAULT_TTL_SECONDS:-300}
      Cache__MetadataTtlSeconds: ${CACHE_METADATA_TTL_SECONDS:-300}
      Cache__UserSummariesTtlSeconds: ${CACHE_USER_SUMMARIES_TTL_SECONDS:-120}
      Cache__LeaderboardTtlSeconds: ${CACHE_LEADERBOARD_TTL_SECONDS:-30}
      Cache__ActivityTtlSeconds: ${CACHE_ACTIVITY_TTL_SECONDS:-30}
      CodeAnalyzer__Enabled: ${CODE_ANALYZER_ENABLED:-true}
      CodeAnalyzer__Url: http://code-analyzer:8080
      CodeAnalyzer__TimeoutSeconds: ${CODE_ANALYZER_TIMEOUT_SECONDS:-8}
    expose:
    - '8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      code-analyzer:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
    - default
    - code-analyzer-net
    - csharp-runner-net
    - cpp-runner-net
    - java-runner-net
    - javascript-runner-net
    - pascal-runner-net
    - python-runner-net
    - image-cpp-runner-net
    - image-pascal-runner-net
    - image-python-runner-net
  execution-worker:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/execution-worker:${IMAGE_TAG:-develop}
    labels:
    - com.centurylinklabs.watchtower.enable=true
    - com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-taskforge-prod}
    restart: unless-stopped
    environment:
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      RabbitMq__Host: rabbitmq
      InternalApi__Key: ${TASKFORGE_INTERNAL_KEY:?set TASKFORGE_INTERNAL_KEY}
      Services__ExecutionApi: http://execution-api:8080
      Services__SolutionsApi: http://solutions-api:8080
      ExecutionQueue__MaxAttempts: ${EXECUTION_QUEUE_MAX_ATTEMPTS:-3}
      ExecutionQueue__RunningTimeoutMinutes: ${EXECUTION_QUEUE_RUNNING_TIMEOUT_MINUTES:-5}
      Judge__TimeoutSeconds: ${JUDGE_TIMEOUT_SECONDS:-45}
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-taskforge}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
      Runners__Cpp: http://cpp-runner:8080
      Runners__CSharp: http://csharp-runner:8080
      Runners__Java: http://java-runner:8080
      Runners__Javascript: http://javascript-runner:8080
      Runners__Pascal: http://pascal-runner:8080
      Runners__Python: http://python-runner:8080
      Runners__ImageCpp: http://image-cpp-runner:8000
      CodeAnalyzer__Enabled: ${CODE_ANALYZER_ENABLED:-true}
      CodeAnalyzer__Url: http://code-analyzer:8080
      CodeAnalyzer__FailClosed: ${CODE_ANALYZER_FAIL_CLOSED:-true}
      CodeAnalyzer__TimeoutSeconds: ${CODE_ANALYZER_TIMEOUT_SECONDS:-8}
      Runners__ImagePascal: http://image-pascal-runner:8000
      Runners__ImagePython: http://image-python-runner:8000
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD},abortConnect=false
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD},abortConnect=false
      Cache__Enabled: ${CACHE_ENABLED:-true}
      Cache__DefaultTtlSeconds: ${CACHE_DEFAULT_TTL_SECONDS:-300}
      Cache__MetadataTtlSeconds: ${CACHE_METADATA_TTL_SECONDS:-300}
      Cache__UserSummariesTtlSeconds: ${CACHE_USER_SUMMARIES_TTL_SECONDS:-120}
      Cache__LeaderboardTtlSeconds: ${CACHE_LEADERBOARD_TTL_SECONDS:-30}
      Cache__ActivityTtlSeconds: ${CACHE_ACTIVITY_TTL_SECONDS:-30}
    networks:
    - default
    - csharp-runner-net
    - cpp-runner-net
    - java-runner-net
    - javascript-runner-net
    - pascal-runner-net
    - python-runner-net
    - image-cpp-runner-net
    - image-pascal-runner-net
    - image-python-runner-net
    - code-analyzer-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      execution-api:
        condition: service_healthy
      solutions-api:
        condition: service_healthy
      cpp-runner:
        condition: service_healthy
      csharp-runner:
        condition: service_healthy
      java-runner:
        condition: service_healthy
      javascript-runner:
        condition: service_healthy
      pascal-runner:
        condition: service_healthy
      python-runner:
        condition: service_healthy
      code-analyzer:
        condition: service_healthy
      image-cpp-runner:
        condition: service_healthy
      image-pascal-runner:
        condition: service_healthy
      image-python-runner:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  csharp-runner:
    security_opt: *id001
    init: true
    user: "65534:65534"
    stop_grace_period: 3s
    ulimits:
      core: 0
      nofile:
        soft: 256
        hard: 256
    cap_drop: *id002
    pids_limit: ${RUNNER_PIDS_LIMIT:-128}
    mem_limit: ${RUNNER_MEM_LIMIT:-512m}
    memswap_limit: ${RUNNER_MEM_LIMIT:-512m}
    cpus: ${RUNNER_CPUS:-1.0}
    read_only: true
    tmpfs: *id003
    networks:
    - csharp-runner-net
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/csharp-runner:${IMAGE_TAG:-develop}
    labels:
    - com.centurylinklabs.watchtower.enable=${WATCHTOWER_OJ_ENABLE:-false}
    - com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-taskforge-prod}
    restart: unless-stopped
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
      DOTNET_EnableDiagnostics: 0
      COMPlus_EnableDiagnostics: 0
      CODE_ANALYZER_PUBLIC_KEY_PATH: /run/secrets/code-analyzer-public.pem
      CODE_ANALYZER_POLICY_VERSION: 2026-07-28.4
    secrets:
    - source: code_analyzer_public_key
      target: code-analyzer-public.pem
