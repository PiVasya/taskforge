services:
  identity-api:
    image: ${IMAGE_REPOSITORY:?set IMAGE_REPOSITORY}/identity-api:${IMAGE_TAG:-develop}
    labels:
    - com.centurylinklabs.watchtower.enable=true
    - com.centurylinklabs.watchtower.scope=${WATCHTOWER_SCOPE:-taskforge-prod}
    restart: unless-stopped
    environment:
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
      Database__EnsureCreated: ${ENSURE_CREATED:-false}
      Jwt__Key: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-TaskForge}
      Jwt__Audience: ${JWT_AUDIENCE:-TaskForge}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      InternalApi__Key: ${TASKFORGE_INTERNAL_KEY:?set TASKFORGE_INTERNAL_KEY}
      Telegram__BotUsername: ${SUPPORT_BOT_USERNAME:-}
      Services__SupportBot: http://support-bot:8080
      AiAccessTelemetry__Enabled: ${AI_ACCESS_TELEMETRY_ENABLED:-true}
      AiAccounts__UnlimitedLoginRateLimit: ${AI_ACCOUNTS_UNLIMITED_LOGIN_RATE_LIMIT:-true}
      AiAccessTelemetry__SupportBotBaseUrl: http://support-bot:8080
      Telegram__CodeLifetimeMinutes: ${TELEGRAM_LINK_CODE_LIFETIME_MINUTES:-10}
      Telegram__CodeCooldownSeconds: ${TELEGRAM_LINK_CODE_COOLDOWN_SECONDS:-30}
      Telegram__CodeIssueLimit: ${TELEGRAM_LINK_CODE_ISSUE_LIMIT:-5}
      Telegram__CodeIssueWindowMinutes: ${TELEGRAM_LINK_CODE_ISSUE_WINDOW_MINUTES:-60}
      Telegram__ConfirmAttemptLimit: ${TELEGRAM_LINK_CONFIRM_ATTEMPT_LIMIT:-8}
      Telegram__ConfirmAttemptWindowMinutes: ${TELEGRAM_LINK_CONFIRM_ATTEMPT_WINDOW_MINUTES:-5}
      SUPPORT_BOT_USERNAME: ${SUPPORT_BOT_USERNAME:-}
      TELEGRAM_BOT_USERNAME: ${SUPPORT_BOT_USERNAME:-}
      Services__SolutionsApi: http://solutions-api:8080
      Services__TasksApi: http://tasks-api:8080
      RabbitMq__UserName: ${RABBITMQ_DEFAULT_USER:-taskforge}
      RabbitMq__Password: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
      S3__Endpoint: ${S3_INTERNAL_ENDPOINT:-http://minio:9000}
      S3__PublicEndpoint: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT}
      S3__AccessKey: ${MINIO_ROOT_USER:-taskforge}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      ConnectionStrings__DefaultConnection: Host=${DB_HOST:-postgres};Port=${DB_PORT:-5432};Database=taskforge_identity;Username=${POSTGRES_USER:-taskforge};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      Jwt__ExpireMinutes: ${JWT_EXPIRE_MINUTES:-120}
      Bootstrap__FirstUserIsAdmin: ${BOOTSTRAP_FIRST_USER_IS_ADMIN:-false}
      Bootstrap__AdminEmails: ${BOOTSTRAP_ADMIN_EMAILS:-}
      S3__Bucket: ${S3_BUCKET:-taskforge-files}
      S3__Region: ${S3_REGION:-us-east-1}
      S3__UsePathStyle: ${S3_USE_PATH_STYLE:-true}
      ConnectionStrings__Redis: ${REDIS_HOST:-redis}:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD},abortConnect=false
      Redis__ConnectionString: ${REDIS_HOST:-redis}:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD},abortConnect=false
      Cache__Enabled: ${CACHE_ENABLED:-true}
      Cache__DefaultTtlSeconds: ${CACHE_DEFAULT_TTL_SECONDS:-300}
      Cache__MetadataTtlSeconds: ${CACHE_METADATA_TTL_SECONDS:-300}
      Cache__UserSummariesTtlSeconds: ${CACHE_USER_SUMMARIES_TTL_SECONDS:-120}
      Cache__LeaderboardTtlSeconds: ${CACHE_LEADERBOARD_TTL_SECONDS:-30}
      Cache__ActivityTtlSeconds: ${CACHE_ACTIVITY_TTL_SECONDS:-30}
    expose:
    - '8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
