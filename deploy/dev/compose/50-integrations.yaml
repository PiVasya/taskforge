      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=taskforge_minecraft;Username=${POSTGRES_USER:-taskforge};Password=${POSTGRES_PASSWORD:-taskforge_dev_password}
      S3__Bucket: ${S3_BUCKET:-taskforge-files}
      S3__Region: ${S3_REGION:-us-east-1}
      S3__UsePathStyle: ${S3_USE_PATH_STYLE:-true}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
