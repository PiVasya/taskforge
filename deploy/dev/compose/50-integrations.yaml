services:
  support-api:
    build:
      context: ../../..
      dockerfile: services/support/api/Dockerfile
    environment:
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      InternalApi__Key: ${TASKFORGE_INTERNAL_KEY:-dev_internal_key_change_me}
      Services__IdentityApi: http://identity-api:8080
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
      Database__EnsureCreated: ${ENSURE_CREATED:-false}
      Jwt__Key: ${JWT_SIGNING_KEY:-dev_change_me_please_change_me_please_32_chars}
      Jwt__Issuer: ${JWT_ISSUER:-TaskForge}
      Jwt__Audience: ${JWT_AUDIENCE:-TaskForge}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev_change_me_please_change_me_please_32_chars}
      S3__Endpoint: http://minio:9000
      S3__AccessKey: ${MINIO_ROOT_USER:-taskforge}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:-taskforge_minio_password}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=taskforge_support;Username=${POSTGRES_USER:-taskforge};Password=${POSTGRES_PASSWORD:-taskforge_dev_password}
      S3__Bucket: ${S3_BUCKET:-taskforge-files}
      S3__Region: ${S3_REGION:-us-east-1}
      S3__UsePathStyle: ${S3_USE_PATH_STYLE:-true}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Redis__ConnectionString: redis:6379,abortConnect=false
      Cache__Enabled: ${CACHE_ENABLED:-true}
      Cache__DefaultTtlSeconds: ${CACHE_DEFAULT_TTL_SECONDS:-300}
      Cache__MetadataTtlSeconds: ${CACHE_METADATA_TTL_SECONDS:-300}
      Cache__UserSummariesTtlSeconds: ${CACHE_USER_SUMMARIES_TTL_SECONDS:-120}
      Cache__LeaderboardTtlSeconds: ${CACHE_LEADERBOARD_TTL_SECONDS:-30}
      Cache__ActivityTtlSeconds: ${CACHE_ACTIVITY_TTL_SECONDS:-30}
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  support-bot:
    build:
      context: ../../..
      dockerfile: services/bots/support-bot/Dockerfile
    environment:
      Services__SupportApi: http://support-api:8080
      Services__IdentityApi: http://identity-api:8080
      SupportApi__InternalKey: ${TASKFORGE_INTERNAL_KEY:?set TASKFORGE_INTERNAL_KEY}
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
      ASPNETCORE_URLS: http://+:8080
      SupportApi__BaseUrl: http://support-api:8080
      IdentityApi__BaseUrl: http://identity-api:8080
      InternalApi__Key: ${TASKFORGE_INTERNAL_KEY:-dev_internal_key_change_me}
      AiAccessTelemetry__Enabled: ${AI_ACCESS_TELEMETRY_ENABLED:-true}
      AiAccessTelemetry__ChatId: ${AI_ACCESS_TELEMETRY_CHAT_ID:-}
      AiAccessTelemetry__QuietSeconds: ${AI_ACCESS_TELEMETRY_QUIET_SECONDS:-45}
      AiAccessTelemetry__MinNotificationIntervalSeconds: ${AI_ACCESS_TELEMETRY_MIN_NOTIFICATION_INTERVAL_SECONDS:-120}
      AiAccessTelemetry__MaxDigestIntervalSeconds: ${AI_ACCESS_TELEMETRY_MAX_DIGEST_INTERVAL_SECONDS:-300}
      AiAccessTelemetry__DiscoveryOnlyMinEvents: ${AI_ACCESS_TELEMETRY_DISCOVERY_MIN_EVENTS:-4}
      AiAccessTelemetry__RetentionSeconds: ${AI_ACCESS_TELEMETRY_RETENTION_SECONDS:-900}
      AiAccessTelemetry__MaxPendingEvents: ${AI_ACCESS_TELEMETRY_MAX_PENDING_EVENTS:-2000}
      AiAccessTelemetry__MaxEventsPerDigest: ${AI_ACCESS_TELEMETRY_MAX_EVENTS_PER_DIGEST:-500}
      AiAccessTelemetry__MaxVisitorsPerDigest: ${AI_ACCESS_TELEMETRY_MAX_VISITORS_PER_DIGEST:-6}
      AiAccessTelemetry__MaxClientGroupsPerDigest: ${AI_ACCESS_TELEMETRY_MAX_CLIENT_GROUPS_PER_DIGEST:-6}
      AiAccessTelemetry__GatewayLogPath: /var/log/taskforge-gateway/edge-events.log
      AiAccessTelemetry__IncludeFullIp: ${AI_ACCESS_TELEMETRY_INCLUDE_FULL_IP:-false}
      Telegram__BotToken: ${SUPPORT_BOT_TOKEN:-}
      Telegram__SupportGroupId: ${SUPPORT_BOT_GROUP_ID:-}
      Telegram__BotUsername: ${SUPPORT_BOT_USERNAME:-}
      SUPPORT_BOT_TOKEN: ${SUPPORT_BOT_TOKEN:-}
      SUPPORT_BOT_GROUP_ID: ${SUPPORT_BOT_GROUP_ID:-}
      SUPPORT_BOT_USERNAME: ${SUPPORT_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${SUPPORT_BOT_TOKEN:-}
      TELEGRAM_SUPPORT_GROUP_ID: ${SUPPORT_BOT_GROUP_ID:-}
      TELEGRAM_BOT_USERNAME: ${SUPPORT_BOT_USERNAME:-}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Redis__ConnectionString: redis:6379,abortConnect=false
      Cache__Enabled: ${CACHE_ENABLED:-true}
      Cache__DefaultTtlSeconds: ${CACHE_DEFAULT_TTL_SECONDS:-300}
      Cache__MetadataTtlSeconds: ${CACHE_METADATA_TTL_SECONDS:-300}
      Cache__UserSummariesTtlSeconds: ${CACHE_USER_SUMMARIES_TTL_SECONDS:-120}
      Cache__LeaderboardTtlSeconds: ${CACHE_LEADERBOARD_TTL_SECONDS:-30}
      Cache__ActivityTtlSeconds: ${CACHE_ACTIVITY_TTL_SECONDS:-30}
    volumes:
      - gateway-ai-telemetry:/var/log/taskforge-gateway:ro
    expose:
      - '8080'
    depends_on:
      support-api:
        condition: service_healthy
      identity-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
