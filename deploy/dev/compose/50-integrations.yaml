      BrowserRateLimits__SnapshotWindowSeconds: ${BROWSER_SNAPSHOT_WINDOW_SECONDS:-60}
      BrowserRateLimits__RenderLimit: ${BROWSER_RENDER_LIMIT:-10}
      BrowserRateLimits__RenderWindowSeconds: ${BROWSER_RENDER_WINDOW_SECONDS:-60}
      BrowserRateLimits__SessionCreateLimit: ${BROWSER_SESSION_CREATE_LIMIT:-5}
      BrowserRateLimits__SessionCreateWindowSeconds: ${BROWSER_SESSION_CREATE_WINDOW_SECONDS:-60}
      BrowserRateLimits__SessionActionLimit: ${BROWSER_SESSION_ACTION_LIMIT:-120}
      BrowserRateLimits__SessionActionWindowSeconds: ${BROWSER_SESSION_ACTION_WINDOW_SECONDS:-60}
