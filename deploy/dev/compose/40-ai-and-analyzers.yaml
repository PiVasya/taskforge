services:
  ai-api:
    build:
      context: ../../..
      dockerfile: services/ai/api/Dockerfile
    environment:
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
      Database__EnsureCreated: ${ENSURE_CREATED:-false}
      Jwt__Key: ${JWT_SIGNING_KEY:-dev_change_me_please_change_me_please_32_chars}
      Jwt__Issuer: ${JWT_ISSUER:-TaskForge}
      Jwt__Audience: ${JWT_AUDIENCE:-TaskForge}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev_change_me_please_change_me_please_32_chars}
      S3__Endpoint: http://minio:9000
      S3__AccessKey: ${MINIO_ROOT_USER:-taskforge}
      InternalApi__Key: ${TASKFORGE_AGENT_INTERNAL_KEY:-dev_internal_agent_key_change_me}
      AiWorker__BaseUrl: http://ai-worker:8080
      AiWorker__WakeTimeoutSeconds: 5
      AiWorker__WakeAttempts: 3
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:-taskforge_minio_password}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=taskforge_ai;Username=${POSTGRES_USER:-taskforge};Password=${POSTGRES_PASSWORD:-taskforge_dev_password}
      S3__Bucket: ${S3_BUCKET:-taskforge-files}
      S3__Region: ${S3_REGION:-us-east-1}
      S3__UsePathStyle: ${S3_USE_PATH_STYLE:-true}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Redis__ConnectionString: redis:6379,abortConnect=false
      Cache__Enabled: ${CACHE_ENABLED:-true}
      Cache__DefaultTtlSeconds: ${CACHE_DEFAULT_TTL_SECONDS:-300}
      Cache__MetadataTtlSeconds: ${CACHE_METADATA_TTL_SECONDS:-300}
      Cache__UserSummariesTtlSeconds: ${CACHE_USER_SUMMARIES_TTL_SECONDS:-120}
      Cache__LeaderboardTtlSeconds: ${CACHE_LEADERBOARD_TTL_SECONDS:-30}
      Cache__ActivityTtlSeconds: ${CACHE_ACTIVITY_TTL_SECONDS:-30}
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  ai-worker:
    build:
      context: ../../../services/ai/worker
      dockerfile: Dockerfile
    environment:
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
      ASPNETCORE_URLS: http://+:8080
      TaskForgeInternalApi__BaseUrl: http://ai-api:8080
      TaskForgeInternalApi__ApiKey: ${TASKFORGE_AGENT_INTERNAL_KEY:-dev_internal_agent_key_change_me}
      TaskForgeAgent__ApiKey: ${TASKFORGE_EXTERNAL_AI_API_KEY:-}
      TaskForgeAgent__Model: ${TASKFORGE_EXTERNAL_AI_MODEL:-openai/gpt-4o-mini}
      TaskForgeAgent__OpenAiCompatibleBaseUrl: ${TASKFORGE_EXTERNAL_AI_BASE_URL:-https://openrouter.ai/api/v1}
      TaskForgeAgent__EnableAdaptiveAgentLoop: ${TASKFORGE_AI_ADAPTIVE_LOOP:-true}
      TaskForgeAgent__MaxAgentLoopSteps: ${TASKFORGE_AI_MAX_LOOP_STEPS:-12}
      TaskForgeAgent__MaxDraftsPerRun: ${TASKFORGE_AI_MAX_DRAFTS_PER_RUN:-50}
      TaskForgeAgent__MaxAgentStateCharacters: ${TASKFORGE_AI_MAX_STATE_CHARS:-64000}
      TaskForgeAgent__MaxAgentActionsPerStep: ${TASKFORGE_AI_MAX_ACTIONS_PER_STEP:-8}
      TaskForgeAgent__MaxPatchOperationsPerRun: ${TASKFORGE_AI_MAX_PATCH_OPERATIONS:-200}
      RabbitMq__Host: rabbitmq
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      Redis__ConnectionString: redis:6379,abortConnect=false
      Cache__Enabled: ${CACHE_ENABLED:-true}
      Cache__DefaultTtlSeconds: ${CACHE_DEFAULT_TTL_SECONDS:-300}
      Cache__MetadataTtlSeconds: ${CACHE_METADATA_TTL_SECONDS:-300}
      Cache__UserSummariesTtlSeconds: ${CACHE_USER_SUMMARIES_TTL_SECONDS:-120}
      Cache__LeaderboardTtlSeconds: ${CACHE_LEADERBOARD_TTL_SECONDS:-30}
      Cache__ActivityTtlSeconds: ${CACHE_ACTIVITY_TTL_SECONDS:-30}
    expose:
      - '8080'
    depends_on:
      ai-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - kill -0 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  code-analyzer:
    build:
      context: ../../../services/analyzers/code-analyzer
      dockerfile: Dockerfile
    expose:
      - '8080'
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    environment:
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
  image-analyzer:
    build:
      context: ../../../services/analyzers/image-analyzer
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    pids_limit: ${IMAGE_ANALYZER_PIDS_LIMIT:-128}
    mem_limit: ${IMAGE_ANALYZER_MEM_LIMIT:-6g}
    tmpfs:
      - /tmp:size=${IMAGE_ANALYZER_TMPFS_SIZE:-1g},mode=1777,exec
    expose:
      - '8080'
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    environment:
      OPENCLIP_CACHE_DIR: /models/openclip
      HF_HOME: /models/openclip
      HUGGINGFACE_HUB_CACHE: /models/openclip
      HF_HUB_CACHE: /models/openclip
      HF_HUB_DISABLE_XET: '1'
      TASKFORGE_DEBUG_LOGS: ${TASKFORGE_DEBUG_LOGS:-1}
    memswap_limit: ${IMAGE_ANALYZER_MEMSWAP_LIMIT:-8g}
    volumes:
      - ${TASKFORGE_IMAGE_ANALYZER_MODEL_CACHE_DIR:?set TASKFORGE_IMAGE_ANALYZER_MODEL_CACHE_DIR}:/models/openclip
