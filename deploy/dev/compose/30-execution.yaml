    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  image-cpp-runner:
