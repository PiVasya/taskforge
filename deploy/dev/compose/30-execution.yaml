x-runner-security: &runner-security
  security_opt:
  - no-new-privileges:true
  cap_drop:
  - ALL
  pids_limit: ${RUNNER_PIDS_LIMIT:-128}
  mem_limit: ${RUNNER_MEM_LIMIT:-512m}
  read_only: true
  tmpfs:
  - /tmp:size=${RUNNER_TMPFS_SIZE:-256m},mode=1777,exec
  networks:
  - runner-net

services:
  execution-api:
    build:
      context: ../../..
      dockerfile: services/execution/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      RabbitMq__Host: rabbitmq
      InternalApi__Key: ${TASKFORGE_INTERNAL_KEY:-dev_internal_key_change_me}
      Database__MigrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
      Database__EnsureCreated: ${ENSURE_CREATED:-false}
      Jwt__Key: ${JWT_SIGNING_KEY:-dev_change_me_please_change_me_please_32_chars}
      Jwt__Issuer: ${JWT_ISSUER:-TaskForge}
      Jwt__Audience: ${JWT_AUDIENCE:-TaskForge}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-dev_change_me_please_change_me_please_32_chars}
      S3__Endpoint: http://minio:9000
      S3__AccessKey: ${MINIO_ROOT_USER:-taskforge}
      S3__SecretKey: ${MINIO_ROOT_PASSWORD:-taskforge_minio_password}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=taskforge_execution;Username=${POSTGRES_USER:-taskforge};Password=${POSTGRES_PASSWORD:-taskforge_dev_password}
      S3__Bucket: ${S3_BUCKET:-taskforge-files}
      S3__Region: ${S3_REGION:-us-east-1}
      S3__UsePathStyle: ${S3_USE_PATH_STYLE:-true}
    expose:
    - '8080'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
  execution-worker:
    build:
      context: ../../..
      dockerfile: services/execution/worker/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      InternalApi__Key: ${TASKFORGE_INTERNAL_KEY:-dev_internal_key_change_me}
      Services__ExecutionApi: http://execution-api:8080
      Services__SolutionsApi: http://solutions-api:8080
      ExecutionQueue__MaxAttempts: ${EXECUTION_QUEUE_MAX_ATTEMPTS:-3}
      ExecutionQueue__RunningTimeoutMinutes: ${EXECUTION_QUEUE_RUNNING_TIMEOUT_MINUTES:-5}
      Judge__TimeoutSeconds: ${JUDGE_TIMEOUT_SECONDS:-45}
      Runners__Cpp: http://cpp-runner:8080
      Runners__CSharp: http://csharp-runner:8080
      Runners__Java: http://java-runner:8080
      Runners__Javascript: http://javascript-runner:8080
      Runners__Pascal: http://pascal-runner:8080
      Runners__Python: http://python-runner:8080
      Runners__ImageCpp: http://image-cpp-runner:8000
      CodeAnalyzer__Enabled: ${CODE_ANALYZER_ENABLED:-true}
      CodeAnalyzer__Url: http://code-analyzer:8080
      CodeAnalyzer__FailClosed: ${CODE_ANALYZER_FAIL_CLOSED:-true}
      CodeAnalyzer__TimeoutSeconds: ${CODE_ANALYZER_TIMEOUT_SECONDS:-8}
      Runners__ImagePascal: http://image-pascal-runner:8000
    networks:
    - default
    - runner-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      execution-api:
        condition: service_healthy
      solutions-api:
        condition: service_healthy
      cpp-runner:
        condition: service_healthy
      csharp-runner:
        condition: service_healthy
      java-runner:
        condition: service_healthy
      javascript-runner:
        condition: service_healthy
      pascal-runner:
        condition: service_healthy
      python-runner:
        condition: service_healthy
      code-analyzer:
        condition: service_healthy
      image-cpp-runner:
        condition: service_healthy
      image-pascal-runner:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - kill -0 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  csharp-runner:
    <<: *runner-security
    build:
      context: ../../../services/execution/runners/csharp-runner
      dockerfile: Dockerfile
    expose:
    - '8080'
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  cpp-runner:
