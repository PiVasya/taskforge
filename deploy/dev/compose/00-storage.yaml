name: taskforge-real-microservices-dev
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskforge_dev_password}
      POSTGRES_DB: postgres
    volumes:
    - postgres-data:/var/lib/postgresql
    - ../../../infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
    - ${DEV_POSTGRES_PORT:-5432}:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-taskforge} -d postgres
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
    - ${DEV_RABBITMQ_PORT:-5672}:5672
    - ${DEV_RABBITMQ_MANAGEMENT_PORT:-15672}:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - ping
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
    - ${DEV_REDIS_PORT:-6379}:6379
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-taskforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-taskforge_minio_password}
    ports:
    - ${DEV_MINIO_PORT:-9000}:9000
    - ${DEV_MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
    - minio-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:9000/minio/health/live || curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || kill -0 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
volumes:
  postgres-data: null
  minio-data: null
  redis-data: null
