services:
  gateway:
    build:
      context: ../../../apps/gateway
      dockerfile: Dockerfile
    environment:
      GATEWAY_MODE: http
      DOMAIN: ${DOMAIN:-taskforge.local}
      CT_DOMAIN: ${CT_DOMAIN:-ct.taskforge.local}
    ports:
    - ${DEV_GATEWAY_HTTP_PORT:-18080}:80
    depends_on:
      front:
        condition: service_healthy
      front-ct:
        condition: service_healthy
      identity-api:
        condition: service_healthy
      education-api:
        condition: service_healthy
      content-api:
        condition: service_healthy
      quiz-api:
        condition: service_healthy
      tasks-api:
        condition: service_healthy
      solutions-api:
        condition: service_healthy
      execution-api:
        condition: service_healthy
      ai-api:
        condition: service_healthy
      support-api:
        condition: service_healthy
      minecraft-api:
        condition: service_healthy
      files-api:
        condition: service_healthy
      notifications-api:
        condition: service_healthy
      observability-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:80/health/gateway || curl -fsS http://127.0.0.1:80/health/gateway
        >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  front:
    build:
      context: ../../../apps/web
      dockerfile: Dockerfile
    expose:
    - '80'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:80/health || curl -fsS http://127.0.0.1:80/health
        >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  front-ct:
    build:
      context: ../../../apps/web-ct
      dockerfile: Dockerfile
    expose:
    - '80'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --spider http://127.0.0.1:80/health || curl -fsS http://127.0.0.1:80/health
        >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
