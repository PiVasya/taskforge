networks:
  appnet:

volumes:
  pgdata:

services:
  db:
    image: postgres:17
    container_name: taskforge-db
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: taskforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [appnet]
    restart: unless-stopped

  api:
    build:
      context: ./taskforge
      dockerfile: Dockerfile
    image: taskforge-api:local
    container_name: taskforge-api
    depends_on: [cpp-runner, csharp-runner, python-runner]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=host.docker.internal;Port=5432;Database=taskforge_dev;Username=postgres;Password=SuperSecret"
      Compilers__cpp__Url: "http://cpp-runner:8080"
      Compilers__cpp__TimeoutMs: "12000"
      Compilers__csharp__Url: "http://csharp-runner:8080"
      Compilers__csharp__TimeoutMs: "12000"
      Compilers__python__Url: "http://python-runner:8080"
      Compilers__python__TimeoutMs: "8000"
      API_INTERNAL_KEY: "dev-internal-key"
      AI__Enabled: "true"
      AI__SystemUserEmail: "taskforge.ai@system.local"
      AI__SystemUserFirstName: "TaskForge"
      AI__SystemUserLastName: "AI"
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped

  front:
    build:
      context: ./clientapp
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_BASE=/api
    image: taskforge-front:local
    container_name: taskforge-front
    expose: ["80"]
    networks: [appnet]
    restart: unless-stopped

  cpp-runner:
    build:
      context: ./cpp-runner
      dockerfile: Dockerfile
    image: taskforge-cpp-runner:local
    container_name: taskforge-cpp-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped

  csharp-runner:
    build:
      context: ./csharp-runner
      dockerfile: Dockerfile
    image: taskforge-csharp-runner:local
    container_name: taskforge-csharp-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped

  python-runner:
    build:
      context: ./python-runner
      dockerfile: Dockerfile
    image: taskforge-python-runner:local
    container_name: taskforge-python-runner
    expose: ["8080"]
    networks: [appnet]
    restart: unless-stopped

  taskforge-ai-worker:
    build:
      context: ./taskforge-ai-worker
      dockerfile: Dockerfile
    image: taskforge-ai-worker:local
    container_name: taskforge-ai-worker
    depends_on: [api]
    environment:
      TASKFORGE_API_BASE: "http://api:8080"
      TASKFORGE_INTERNAL_KEY: "dev-internal-key"
      TASKFORGE_AI_WORKER_ID: "taskforge-ai-worker-local"
      TASKFORGE_AI_CAPABILITIES: "*"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "qwen3:14b"
      POLL_INTERVAL_SECONDS: "10"
      TASKFORGE_AI_LOG_DIR: "/app/logs"
      TASKFORGE_AI_LOG_FILE: "/app/logs/worker.log"
      TASKFORGE_AI_JSON_LOG_FILE: "/app/logs/worker.jsonl"
      TASKFORGE_AI_LOG_LEVEL: "INFO"
      TASKFORGE_AI_LOG_INCLUDE_PROMPTS: "true"
      TASKFORGE_AI_LOG_INCLUDE_RESPONSES: "true"
    volumes:
      - ./logs/taskforge-ai-worker:/app/logs
    networks: [appnet]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: taskforge-nginx-local
    depends_on: [front, api]
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks: [appnet]
    restart: unless-stopped
