map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Common routing is duplicated per domain so the main site and CT site can have different SPA frontends.
server {
  listen 80;
  server_name ${DOMAIN};
  client_max_body_size 80m;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;


  # Microservice routing v2: slashless and slash-compatible API prefixes.
  # Specific routes first; nginx regex locations use first-match order.
  location ~ ^/api/courses/[^/]+/assignments(/|$) { proxy_pass http://tasks-api:8080; }
  location ~ ^/api/assignments/[^/]+/(submit|top-solutions)(/|$) { proxy_pass http://solutions-api:8080; }
  location ~ ^/api/assignments/[^/]+/image-test(/|$) { proxy_pass http://execution-api:8080; }
  location ~ ^/api/admin/users/[^/]+/groups(/|$) { proxy_pass http://education-api:8080; }
