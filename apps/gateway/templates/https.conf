map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
  default $scheme;
  ~^(http|https)$ $http_x_forwarded_proto;
}

map $forwarded_proto $forwarded_ssl {
  default off;
  https on;
}

map $http_host $forwarded_port {
  default $server_port;
  ~^[^:]+:(?<host_port>[0-9]+)$ $host_port;
}

# Cheap edge protection for the public Chromium API. Endpoint-aware quotas are
# enforced again by browser-api through Redis.
limit_req_zone $binary_remote_addr zone=tf_browser_public:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=tf_browser_connections:10m;

# Docker DNS. Keep upstream service names dynamic so nginx does not keep stale
# container IPs after Watchtower/docker compose recreates backend containers.
resolver 127.0.0.11 ipv6=off valid=10s;
resolver_timeout 5s;

server {
  listen 80;
  server_name ${DOMAIN} ${CT_DOMAIN};

  include /etc/nginx/snippets/acme.conf;
  include /etc/nginx/snippets/ha-routes.conf;

  location = /health/gateway {
    default_type text/plain;
    return 200 'ok';
  }

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${DOMAIN};
  client_max_body_size 80m;
  absolute_redirect off;
  server_name_in_redirect off;
  port_in_redirect off;

  ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  include /etc/nginx/snippets/proxy-common.conf;
  include /etc/nginx/snippets/api-routes.conf;
  include /etc/nginx/snippets/hub-routes.conf;

  location / {
    set $taskforge_front_upstream http://front:80;
    proxy_pass $taskforge_front_upstream;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ${CT_DOMAIN};
  client_max_body_size 80m;
  absolute_redirect off;
  server_name_in_redirect off;
  port_in_redirect off;

  ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  include /etc/nginx/snippets/proxy-common.conf;
  include /etc/nginx/snippets/api-routes.conf;
  include /etc/nginx/snippets/hub-routes.conf;

  location / {
    set $taskforge_front_ct_upstream http://front-ct:80;
    proxy_pass $taskforge_front_ct_upstream;
  }
}
