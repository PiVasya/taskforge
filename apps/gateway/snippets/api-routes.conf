include /etc/nginx/snippets/ha-routes.conf;

location = /health/gateway {
  default_type text/plain;
  return 200 'ok';
}

# Keep API trailing-slash normalization internal. Browser-visible 301/308 redirects
# can drop local dev ports and cause false CORS failures.
rewrite ^(/api/.+)/+$ $1 last;

# Public TaskForge browser/AI discovery and real Chromium inspection.
location = /.well-known/taskforge-ai.json {
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_read_timeout 30s;
}
location = /.well-known/taskforge-ai-browser.json {
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_read_timeout 30s;
}
location = /ai-browser {
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_read_timeout 30s;
}
location = /llms.txt {
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_read_timeout 30s;
}
location = /robots.txt {
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_read_timeout 30s;
}
location = /ai-access {
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_read_timeout 30s;
}
location = /sitemap.xml {
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_read_timeout 30s;
}
location ^~ /ai-artifacts/ {
  limit_req zone=tf_browser_public burst=30 nodelay;
  limit_req_status 429;
  limit_conn tf_browser_connections 10;
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_connect_timeout 10s;
  proxy_read_timeout 75s;
  proxy_send_timeout 75s;
}
# Crawler captures persist semantic snapshot + PNG synchronously. They are the
# heaviest anonymous Browser API operation, so isolate their connection budget
# from metadata/artifact reads. Excess parallel captures fail fast with 429
# instead of making every Chromium render slow enough to miss crawler deadlines.
location ~* ^/api/site/agent/capture/ {
  client_max_body_size 1m;
  limit_req zone=tf_browser_public burst=10 nodelay;
  limit_req_status 429;
  limit_conn tf_browser_capture_connections 2;
  limit_conn_status 429;
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_connect_timeout 10s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}
# Remote-browser compatibility for AI clients that can only follow GET links.
# It controls the same BrowserSessionRegistry/Chromium implementation as the normal
# POST Browser API; it is not a second browser backend.
location ^~ /api/ai/browser {
  client_max_body_size 1m;
  limit_req zone=tf_browser_public burst=60 nodelay;
  limit_req_status 429;
  limit_conn tf_browser_connections 10;
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_connect_timeout 10s;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;
}

location ~* ^/api/(site|browser)(/|$) {
  client_max_body_size 1m;
  limit_req zone=tf_browser_public burst=30 nodelay;
  limit_req_status 429;
  limit_conn tf_browser_connections 10;
  set $taskforge_upstream http://browser-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_connect_timeout 10s;
  proxy_read_timeout 75s;
  proxy_send_timeout 75s;
}

# Most specific split routes first.
location ~* ^/api/courses/[^/]+/assignments(/|$) {
  set $taskforge_upstream http://tasks-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/assignments/[^/]+/(submit|top-solutions)(/|$) {
  set $taskforge_upstream http://solutions-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/assignments/[^/]+/image-test(/|$) {
  set $taskforge_upstream http://tasks-api:8080;
  proxy_pass $taskforge_upstream;
}

location ~* ^/api/admin/users/[^/]+/groups(/|$) {
  set $taskforge_upstream http://education-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/users/[^/]+/(test-attempts|math-attempts)(/|$) {
  set $taskforge_upstream http://tasks-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/users/[^/]+/(solutions|image-solutions)(/|$) {
  set $taskforge_upstream http://solutions-api:8080;
  proxy_pass $taskforge_upstream;
}

