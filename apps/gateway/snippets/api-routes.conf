location = /health/gateway {
  add_header Content-Type text/plain;
  return 200 'ok';
}

# Keep API trailing-slash normalization internal. Browser-visible 301/308 redirects
# can drop local dev ports and cause false CORS failures.
rewrite ^(/api/.+)/+$ $1 last;

# Most specific split routes first.
location ~* ^/api/courses/[^/]+/assignments(/|$) { proxy_pass http://tasks-api:8080; }
location ~* ^/api/assignments/[^/]+/(submit|top-solutions)(/|$) { proxy_pass http://solutions-api:8080; }
location ~* ^/api/assignments/[^/]+/image-test(/|$) { proxy_pass http://tasks-api:8080; }

location ~* ^/api/admin/users/[^/]+/groups(/|$) { proxy_pass http://education-api:8080; }
location ~* ^/api/admin/users/[^/]+/(test-attempts|math-attempts)(/|$) { proxy_pass http://tasks-api:8080; }
location ~* ^/api/admin/users/[^/]+/(solutions|image-solutions)(/|$) { proxy_pass http://solutions-api:8080; }

# Identity and user administration.
location ~* ^/api/(auth|users|profile)(/|$) { proxy_pass http://identity-api:8080; }
location ~* ^/api/me/ui-settings(/|$) { proxy_pass http://identity-api:8080; }
location ~* ^/api/admin/(users|feature-roles|solution-users)(/|$) { proxy_pass http://identity-api:8080; }
location ~* ^/api/integrations/telegram(/|$) { proxy_pass http://identity-api:8080; }

# Education and content.
location ~* ^/api/(courses|groups)(/|$) { proxy_pass http://education-api:8080; }
location ~* ^/api/admin/groups(/|$) { proxy_pass http://education-api:8080; }
location ~* ^/api/(learning)(/|$) { proxy_pass http://content-api:8080; }
location ~* ^/api/admin/learning(/|$) { proxy_pass http://content-api:8080; }

# Tasks and quiz.
location ~* ^/api/(assignments|task-tests|math-tasks|tests)(/|$) { proxy_pass http://tasks-api:8080; }
location ~* ^/api/admin/(assignments|test-attempts|math-attempts)(/|$) { proxy_pass http://tasks-api:8080; }
location ~* ^/api/me/(test-attempts|math-attempts)(/|$) { proxy_pass http://tasks-api:8080; }
location ~* ^/api/(quiz)(/|$) { proxy_pass http://quiz-api:8080; }
location ~* ^/api/admin/quiz(/|$) { proxy_pass http://quiz-api:8080; }

# Solutions, rating, badges and quotas.
location ~* ^/api/(solutions|judge|judge2|leaderboard|badges|quotas)(/|$) { proxy_pass http://solutions-api:8080; }
location ~* ^/api/me/(solutions|image-solutions|quotas)(/|$) { proxy_pass http://solutions-api:8080; }
location ~* ^/api/admin/(solutions|image-solutions|leaderboard)(/|$) { proxy_pass http://solutions-api:8080; }

# Execution and analyzers.
location ~* ^/api/(compiler|image-runners|execution)(/|$) { proxy_pass http://execution-api:8080; }

# AI.
location ~* ^/api/agent(/|$) { proxy_pass http://ai-api:8080; }

# Integrations and operations.
location ~* ^/api/support(/|$) { proxy_pass http://support-api:8080; }
location ~* ^/api/telegram(/|$) { proxy_pass http://support-api:8080; }
location ~* ^/api/(minecraft)(/|$) { proxy_pass http://minecraft-api:8080; }
location ~* ^/api/integrations/minecraft(/|$) { proxy_pass http://minecraft-api:8080; }
location ~* ^/api/admin/minecraft-links(/|$) { proxy_pass http://minecraft-api:8080; }
location ~* ^/api/(files|private-files)(/|$) { proxy_pass http://files-api:8080; }
location ~* ^/api/notifications(/|$) { proxy_pass http://notifications-api:8080; }
location ~* ^/api/(activity|system-status)(/|$) { proxy_pass http://observability-api:8080; }
location ~* ^/api/admin/(activity|system-status|analytics)(/|$) { proxy_pass http://observability-api:8080; }

# Explicit API fallback. Do not let unknown /api/* requests fall through to the SPA.
location /api/ {
  default_type application/json;
  return 404 '{"message":"API endpoint not found","code":"API_NOT_FOUND"}';
}
