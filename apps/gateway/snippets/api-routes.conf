include /etc/nginx/snippets/ha-routes.conf;

location = /health/gateway {
  default_type text/plain;
  return 200 'ok';
}

# Keep API trailing-slash normalization internal. Browser-visible 301/308 redirects
# can drop local dev ports and cause false CORS failures.
rewrite ^(/api/.+)/+$ $1 last;

# Most specific split routes first.
location ~* ^/api/courses/[^/]+/assignments(/|$) {
  set $taskforge_upstream http://tasks-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/assignments/[^/]+/(submit|top-solutions)(/|$) {
  set $taskforge_upstream http://solutions-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/assignments/[^/]+/image-test(/|$) {
  set $taskforge_upstream http://tasks-api:8080;
  proxy_pass $taskforge_upstream;
}

location ~* ^/api/admin/users/[^/]+/groups(/|$) {
  set $taskforge_upstream http://education-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/users/[^/]+/(test-attempts|math-attempts)(/|$) {
  set $taskforge_upstream http://tasks-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/users/[^/]+/(solutions|image-solutions)(/|$) {
  set $taskforge_upstream http://solutions-api:8080;
  proxy_pass $taskforge_upstream;
}

# Identity and user administration.
location ~* ^/api/(auth|users|profile)(/|$) {
  set $taskforge_upstream http://identity-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/me/ui-settings(/|$) {
  set $taskforge_upstream http://identity-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/solution-users(/|$) {
  set $taskforge_upstream http://solutions-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/(users|feature-roles)(/|$) {
  set $taskforge_upstream http://identity-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/integrations/telegram(/|$) {
  set $taskforge_upstream http://identity-api:8080;
  proxy_pass $taskforge_upstream;
}

# Education and content.
location ~* ^/api/(courses|groups)(/|$) {
  set $taskforge_upstream http://education-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/groups(/|$) {
  set $taskforge_upstream http://education-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/(learning)(/|$) {
  set $taskforge_upstream http://content-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/learning(/|$) {
  set $taskforge_upstream http://content-api:8080;
  proxy_pass $taskforge_upstream;
}

# Tasks and quiz.
location ~* ^/api/(assignments|task-tests|math-tasks|tests)(/|$) {
  set $taskforge_upstream http://tasks-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/(assignments|test-attempts|math-attempts)(/|$) {
  set $taskforge_upstream http://tasks-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/me/(test-attempts|math-attempts)(/|$) {
  set $taskforge_upstream http://tasks-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/(quiz)(/|$) {
  set $taskforge_upstream http://quiz-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/quiz(/|$) {
  set $taskforge_upstream http://quiz-api:8080;
  proxy_pass $taskforge_upstream;
}

# Solutions, rating, badges and quotas.
location ~* ^/api/(solutions|judge|judge2|leaderboard|badges|quotas)(/|$) {
  set $taskforge_upstream http://solutions-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/me/(solutions|image-solutions|quotas)(/|$) {
  set $taskforge_upstream http://solutions-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/(solutions|image-solutions|leaderboard)(/|$) {
  set $taskforge_upstream http://solutions-api:8080;
  proxy_pass $taskforge_upstream;
}

# Execution and analyzers.
# Interactive compiler WebSocket.
location ~* ^/api/compiler/sessions/[^/]+/socket$ {
  include /etc/nginx/snippets/proxy-common.conf;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  set $taskforge_upstream http://execution-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
}

location ~* ^/api/(compiler|image-runners|execution)(/|$) {
  set $taskforge_upstream http://execution-api:8080;
  proxy_pass $taskforge_upstream;
}

# AI.
location ~* ^/api/agent(/|$) {
  set $taskforge_upstream http://ai-api:8080;
  proxy_pass $taskforge_upstream;
}

# Integrations and operations.
location ~* ^/api/support(/|$) {
  set $taskforge_upstream http://support-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/telegram(/|$) {
  set $taskforge_upstream http://support-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/(minecraft)(/|$) {
  set $taskforge_upstream http://minecraft-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/integrations/minecraft(/|$) {
  set $taskforge_upstream http://minecraft-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/minecraft-links(/|$) {
  set $taskforge_upstream http://minecraft-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/(files|private-files)(/|$) {
  set $taskforge_upstream http://files-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/notifications(/|$) {
  set $taskforge_upstream http://notifications-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/(activity|system-status)(/|$) {
  set $taskforge_upstream http://observability-api:8080;
  proxy_pass $taskforge_upstream;
}
location ~* ^/api/admin/(activity|system-status|analytics)(/|$) {
  set $taskforge_upstream http://observability-api:8080;
  proxy_pass $taskforge_upstream;
}

# Explicit API fallback. Do not let unknown /api/* requests fall through to the SPA.
location /api/ {
  default_type application/json;
  return 404 '{"message":"API endpoint not found","code":"API_NOT_FOUND"}';
}
