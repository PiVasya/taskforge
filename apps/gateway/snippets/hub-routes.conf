# SignalR/WebSocket routes.
# Each hub location includes proxy-common explicitly because nginx does not inherit
# server-level proxy_set_header directives when a location defines its own
# proxy_set_header Upgrade/Connection.

location /hubs/agent {
  include /etc/nginx/snippets/proxy-common.conf;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  set $taskforge_upstream http://ai-api:8080;
  proxy_pass $taskforge_upstream;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
}

