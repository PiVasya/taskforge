# Edge-only Browser/AI telemetry. Browser API already reports requests that reach
# the application; this log fills the gap for failures produced at nginx or while
# proxying (rate limits, client disconnects and gateway/upstream failures).
map $uri $taskforge_ai_tracked_path {
  default 0;
  "/.well-known/taskforge-ai.json" 1;
  "/.well-known/taskforge-ai-browser.json" 1;
  "/ai-browser" 1;
  "/llms.txt" 1;
  "/ai-access" 1;
  ~^/ai-artifacts/ 1;
  ~^/api/site(?:/|$) 1;
  ~^/api/browser(?:/|$) 1;
  ~^/api/ai/browser(?:/|$) 1;
}

map $status $taskforge_ai_gateway_failure {
  default 0;
  429 1;
  499 1;
  ~^5[0-9][0-9]$ 1;
}

map "$taskforge_ai_tracked_path:$taskforge_ai_gateway_failure" $taskforge_ai_gateway_log {
  default 0;
  "1:1" 1;
}

log_format taskforge_ai_gateway escape=json '{"at":"$time_iso8601","requestId":"$request_id","remote":"$remote_addr","host":"$host","method":"$request_method","uri":"$uri","status":"$status","requestTime":"$request_time","upstreamStatus":"$upstream_status","userAgent":"$http_user_agent"}';
access_log /var/log/taskforge-ai/edge-events.log taskforge_ai_gateway if=$taskforge_ai_gateway_log;
