# Common reverse-proxy settings for all upstream services.
# The gateway owns the public origin. Frontends must call relative /api and /hubs URLs.
# This preserves:
#   dev:        http://localhost:18080
#   production: https://taskforge.by and https://ct.taskforge.by
#   external TLS terminator mode: X-Forwarded-Proto from an outer proxy
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-TaskForge-Client-IP $remote_addr;
# Never forward a client-supplied Cloudflare identity header to internal services.
# If Cloudflare is introduced later, configure nginx real_ip first so $remote_addr is trusted.
proxy_set_header CF-Connecting-IP "";
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port $forwarded_port;
proxy_set_header X-Forwarded-Ssl $forwarded_ssl;

# If an upstream returns an absolute Location header, rewrite it back to the
# public browser origin instead of leaking internal service names or dropping
# the local dev port.
proxy_redirect ~^https?://[^/]+(/.*)$ $forwarded_proto://$http_host$1;

# Development trace propagation. These headers let downstream services correlate browser -> gateway -> microservice calls.
proxy_set_header X-Request-ID $request_id;
proxy_set_header X-TaskForge-Gateway-Request-Id $request_id;
proxy_set_header X-TaskForge-Gateway-Host $http_host;
